id: app-guide-conversation
version: 1
description: Conversation budgets, retained context, status, and reset behavior.
tags:
  - app-guide
  - conversation
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    The conversation input budget defaults to 16,000 estimated tokens (range 4,000–200,000). Other defaults are 12 retained user turns (2–50), 16,000 characters per user message (500–100,000), and 70% of the model window (10–95%). These are defaults, not observed current values. To edit them manually, exit chat with `/exit`, run `hm --ai-settings` in the terminal, choose Conversation in the sidebar, edit, and Save. This interactive command must not enter commands or `/run`. `PROMPTMEUP_CONTEXT_TOKENS` can override the saved input budget before launch. The effective limit is the smallest of that budget, the chosen share of the model window, and space after output reservation. System instructions, runtime facts, loaded guide, selected notes, user messages, and retained answers occupy context. `/context` or `/status` shows current estimates; `~` marks estimates, not provider counts. Older complete turns are removed to fit; a question that cannot fit must be shortened. `/clear` resets active conversation and loaded guide, retaining saved notes and usage totals. `/exit` ends chat.
  it: |-
    Il budget di input della conversazione ha un valore predefinito di 16.000 token stimati (intervallo 4.000–200.000). Gli altri valori predefiniti sono 12 turni utente conservati (2–50), 16.000 caratteri per messaggio utente (500–100.000) e il 70% della finestra del modello (10–95%). Sono valori predefiniti, non quelli attuali verificati. Per cambiarli manualmente, esci dalla chat con `/exit`, esegui `hm --ai-settings` nel terminale, scegli Conversazione nella barra laterale, modifica e Salva. Questo comando interattivo non va in commands o `/run`. `PROMPTMEUP_CONTEXT_TOKENS` può sostituire il budget salvato prima dell'avvio. Il limite effettivo è il minore fra budget, quota della finestra del modello e spazio dopo la riserva per l'output. Istruzioni di sistema, dati dell'ambiente, guida caricata, note selezionate, messaggi utente e risposte conservate occupano contesto. `/context` o `/status` mostra le stime attuali; `~` indica stime, non conteggi del provider. I turni completi più vecchi vengono rimossi per rientrare; una domanda troppo grande va accorciata. `/clear` azzera conversazione attiva e guida caricata, conservando note salvate e totali di utilizzo. `/exit` termina la chat.
  fr: |-
    Le budget d'entrée de la conversation est par défaut de 16 000 jetons estimés (4 000–200 000). Les autres valeurs par défaut sont 12 tours utilisateur conservés (2–50), 16 000 caractères par message (500–100 000) et 70 % de la fenêtre du modèle (10–95 %). Ce ne sont pas des valeurs actuelles observées. Pour les modifier manuellement, quittez le chat avec `/exit`, lancez `hm --ai-settings` dans le terminal, choisissez Conversation dans la barre latérale, modifiez puis enregistrez. Cette commande interactive ne doit pas figurer dans commands ni `/run`. `PROMPTMEUP_CONTEXT_TOKENS` peut remplacer le budget enregistré avant le lancement. La limite effective est le minimum entre budget, part de la fenêtre et espace après réservation de la sortie. Instructions système, données d'exécution, guide chargé, notes sélectionnées, messages utilisateur et réponses conservées occupent le contexte. `/context` ou `/status` affiche les estimations ; `~` indique une estimation, pas un compte du fournisseur. Les anciens tours complets sont retirés pour respecter la limite ; une question trop longue doit être raccourcie. `/clear` réinitialise conversation active et guide chargé, mais garde notes et totaux d'utilisation. `/exit` termine le chat.
  de: |-
    Das Eingabebudget der Unterhaltung beträgt standardmäßig 16.000 geschätzte Token (4.000–200.000). Weitere Standardwerte: 12 gespeicherte Benutzerrunden (2–50), 16.000 Zeichen pro Benutzernachricht (500–100.000) und 70 % des Modellfensters (10–95 %). Das sind Standardwerte, keine beobachteten aktuellen Einstellungen. Zum manuellen Ändern Chat mit `/exit` verlassen, `hm --ai-settings` im Terminal starten, Unterhaltung in der Seitenleiste wählen, ändern und speichern. Dieser interaktive Befehl gehört weder in commands noch in `/run`. `PROMPTMEUP_CONTEXT_TOKENS` kann das gespeicherte Budget vor dem Start überschreiben. Die effektive Grenze ist das Minimum aus Budget, Modellfensteranteil und Platz nach Ausgabereserve. Systemanweisungen, Laufzeitdaten, geladene Anleitung, ausgewählte Notizen, Benutzernachrichten und behaltene Antworten belegen Kontext. `/context` oder `/status` zeigt aktuelle Schätzungen; `~` bedeutet Schätzung, keine Anbieterzählung. Ältere vollständige Runden werden bei Bedarf entfernt; eine zu große Frage muss gekürzt werden. `/clear` setzt aktive Unterhaltung und geladene Anleitung zurück, behält aber Notizen und Verbrauchssummen. `/exit` beendet den Chat.
  es: |-
    El presupuesto de entrada predeterminado es de 16.000 tokens estimados (4.000–200.000). Otros valores predeterminados son 12 turnos de usuario conservados (2–50), 16.000 caracteres por mensaje (500–100.000) y el 70 % de la ventana del modelo (10–95 %). Son valores predeterminados, no ajustes actuales observados. Para cambiarlos manualmente, sal del chat con `/exit`, ejecuta `hm --ai-settings` en el terminal, elige Conversación en la barra lateral, modifica y guarda. Este comando interactivo no debe entrar en commands ni `/run`. `PROMPTMEUP_CONTEXT_TOKENS` puede sustituir el presupuesto guardado antes de iniciar. El límite efectivo es el menor entre presupuesto, parte de la ventana y espacio tras reservar la salida. Instrucciones del sistema, datos del entorno, guía cargada, notas seleccionadas, mensajes del usuario y respuestas conservadas ocupan contexto. `/context` o `/status` muestra estimaciones; `~` indica una estimación, no un recuento del proveedor. Se eliminan turnos completos antiguos para respetar el límite; una pregunta demasiado larga debe acortarse. `/clear` reinicia conversación activa y guía cargada, conservando notas y totales de uso. `/exit` termina el chat.
  vi: |-
    Ngân sách đầu vào hội thoại mặc định là 16.000 token ước tính (4.000–200.000). Các mặc định khác: giữ 12 lượt người dùng (2–50), 16.000 ký tự mỗi tin nhắn (500–100.000), và 70% cửa sổ mô hình (10–95%). Đây là mặc định, không phải cài đặt hiện tại đã được đọc. Để sửa thủ công, thoát chat bằng `/exit`, chạy `hm --ai-settings` trong terminal, chọn Hội thoại ở thanh bên, sửa rồi Lưu. Không đưa lệnh tương tác này vào commands hoặc `/run`. `PROMPTMEUP_CONTEXT_TOKENS` có thể ghi đè ngân sách đã lưu trước khi khởi động. Giới hạn thực tế là giá trị nhỏ nhất giữa ngân sách, tỷ lệ cửa sổ mô hình và chỗ còn lại sau khi dành phần đầu ra. Hướng dẫn hệ thống, dữ kiện môi trường, tài liệu đã tải, ghi chú được chọn, tin nhắn người dùng và câu trả lời được giữ đều chiếm ngữ cảnh. `/context` hoặc `/status` hiển thị ước tính; `~` là ước tính, không phải số đếm của nhà cung cấp. Các lượt cũ hoàn chỉnh được bỏ để vừa giới hạn; câu hỏi quá dài cần rút ngắn. `/clear` đặt lại hội thoại và tài liệu đã tải, giữ ghi chú và tổng sử dụng. `/exit` kết thúc chat.
