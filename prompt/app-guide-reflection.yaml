id: app-guide-reflection
version: 3
description: Run Dream and heartbeat with explicit sharing and memory review.
tags:
  - app-guide
  - dream
  - heartbeat
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    Dream suggests new memories from your observations. First open `hm --setup` → Memory, enable skills and memory for this project, separately enable capture and acknowledge its notice, then Save. Skills and Memory share this form's Save and Cancel; Cancel discards the draft. The direct `hm --learning` flow also remains available. Complete questions in at least two distinct sessions; two messages in one session are not enough. Run `hm --dream` or `/dream`. Read the exact evidence batch shown, then decide whether to share it with OpenAI. Only the displayed batch is sent after confirmation; it holds at most 24 complete observations, subject to the input limit. Old history is not imported. OpenAI must already be configured and enabled. Dream does not run overnight or save memories by itself.

    Heartbeat maintains existing memories. Enable skills and memory in `hm --setup` → Memory and Save, then run `hm --heartbeat` or `/heartbeat`; message capture is not required. It proposes merges for exact duplicates in the shared saved list locally, without OpenAI. You can then approve a separate, displayed batch of saved notes for optional AI review, or decline and keep the local proposals. In both flows use `hm --proposals` or `/proposals` to inspect evidence, edit supported text, and explicitly approve or reject. Flags are informational. A changed note or stale evidence blocks approval; repeat the review with fresh data.

    To enable the maintenance reminder, open `hm --setup` → Memory, enable the reminder at chat start, and Save. It appears when heartbeat has never run or its last run is over seven days old. It only suggests running heartbeat: no background service, automatic AI calls, or automatic cleanup. It differs from dated notes in the set_reminder skill. Forgetting, merging, or archiving a memory asks first and clears all collected messages and suggestions. Other approved notes and earlier AI audit history remain. A chat explanation cannot activate these options, run reflection, or approve changes on the user's behalf.
  it: |-
    Dream propone nuove memorie dalle osservazioni. Apri prima `hm --setup` → Memoria, abilita skills e memoria per il progetto, attiva separatamente la raccolta e accetta il relativo avviso, poi Salva. Skills e Memoria condividono Salva e Annulla nella stessa schermata; Annulla scarta la bozza. Resta disponibile anche il flusso diretto `hm --learning`. Completa domande in almeno due sessioni distinte: due messaggi nella stessa sessione non bastano. Avvia `hm --dream` o `/dream`. Leggi il gruppo esatto di evidenze mostrato, poi scegli se condividerlo con OpenAI. Dopo conferma viene inviato solo quel gruppo: massimo 24 osservazioni complete entro il limite di input. La vecchia cronologia non viene importata. OpenAI deve essere già configurato e abilitato. Dream non lavora durante la notte né salva memorie da solo.

    Heartbeat cura le memorie esistenti. Abilita skills e memoria in `hm --setup` → Memoria e Salva, poi avvia `hm --heartbeat` o `/heartbeat`; la raccolta messaggi non serve. Propone localmente unioni di duplicati esatti nell’elenco unico dei ricordi, senza OpenAI. Puoi poi approvare separatamente l'invio del gruppo di note mostrato per una revisione AI facoltativa, oppure rifiutare mantenendo le proposte locali. In entrambi i flussi usa `hm --proposals` o `/proposals` per esaminare evidenze, modificare i testi consentiti e approvare o rifiutare. Le segnalazioni sono informative. Note cambiate o evidenze scadute bloccano l'approvazione: ripeti con dati aggiornati.

    Per il promemoria manutenzione, apri `hm --setup` → Memoria, attiva il promemoria a inizio chat e Salva. Compare se heartbeat non è mai stato eseguito o risale a oltre sette giorni fa. Suggerisce solo di avviarlo: nessun servizio in background, chiamata AI o pulizia automatica. È diverso dalle note a scadenza della skill set_reminder. Dimenticare, unire o archiviare una memoria chiede conferma e cancella tutti i messaggi raccolti e i suggerimenti. Altre note approvate e registri AI precedenti restano. Una spiegazione in chat non può attivare opzioni, avviare analisi o approvare modifiche al posto dell'utente.
  fr: |-
    Dream propose de nouvelles mémoires à partir des observations. Ouvrez `hm --setup` → Mémoire, activez les compétences et la mémoire du projet puis, séparément, la collecte avec son accord explicite, et Enregistrer. Compétences et Mémoire partagent Enregistrer et Annuler dans le même formulaire ; Annuler abandonne le brouillon. Le parcours direct `hm --learning` reste disponible. Terminez des questions dans au moins deux sessions distinctes ; deux messages dans une session ne suffisent pas. Lancez `hm --dream` ou `/dream`. Lisez le lot exact de preuves affiché, puis décidez de le partager avec OpenAI. Seul ce lot est envoyé après confirmation : au plus 24 observations entières, selon la limite d'entrée. L'ancien historique n'est pas importé. OpenAI doit déjà être configuré et activé. Dream ne travaille pas la nuit et n'enregistre rien seul.

    Heartbeat entretient les mémoires existantes. Activez les compétences et la mémoire dans `hm --setup` → Mémoire, enregistrez, puis lancez `hm --heartbeat` ou `/heartbeat` ; la collecte n'est pas nécessaire. Il propose localement de fusionner les doublons exacts de la liste partagée, sans OpenAI. Vous pouvez ensuite approuver séparément le lot de notes affiché pour une revue IA facultative, ou refuser en conservant les propositions locales. Dans les deux cas, `hm --proposals` ou `/proposals` permet de lire les preuves, modifier les textes prévus et approuver ou rejeter explicitement. Les signalements sont informatifs. Des notes modifiées ou preuves périmées bloquent l'approbation : recommencez avec des données à jour.

    Pour le rappel d'entretien, ouvrez `hm --setup` → Mémoire, activez le rappel en début de chat et enregistrez. Il apparaît si heartbeat n'a jamais tourné ou remonte à plus de sept jours. Il suggère seulement de le lancer : aucun service de fond, appel IA ou nettoyage automatique. Il diffère des notes datées de set_reminder. Oublier, fusionner ou archiver une mémoire demande confirmation et efface tous les messages collectés et les suggestions. Les autres notes approuvées et anciennes traces IA restent. Une réponse de chat ne peut activer ces options, lancer l'analyse ni approuver à la place de l'utilisateur.
  de: |-
    Dream schlägt aus Beobachtungen neue Erinnerungen vor. Zuerst `hm --setup` → Gedächtnis öffnen, Skills und Gedächtnis für das Projekt sowie getrennt die Erfassung aktivieren, deren Hinweis bestätigen und Speichern wählen. Skills und Gedächtnis teilen Speichern und Abbrechen im selben Formular; Abbrechen verwirft den Entwurf. Der direkte Ablauf `hm --learning` bleibt verfügbar. Anfragen in mindestens zwei verschiedenen Sitzungen abschließen; zwei Nachrichten einer Sitzung reichen nicht. `hm --dream` oder `/dream` starten. Das genau angezeigte Belegpaket lesen und entscheiden, ob es an OpenAI gehen darf. Erst nach Bestätigung wird dieses Paket gesendet: höchstens 24 vollständige Beobachtungen innerhalb des Eingabelimits. Alte Verläufe werden nicht importiert. OpenAI muss eingerichtet und aktiviert sein. Dream läuft nicht nachts und speichert nichts selbstständig.

    Heartbeat pflegt vorhandene Erinnerungen. Skills und Gedächtnis unter `hm --setup` → Gedächtnis aktivieren und speichern, dann `hm --heartbeat` oder `/heartbeat` starten; Nachrichtenerfassung ist nicht nötig. Exakte Duplikate der gemeinsamen Liste werden lokal zur Zusammenführung vorgeschlagen, ohne OpenAI. Anschließend kann das angezeigte Notizpaket separat für eine optionale KI-Prüfung freigegeben werden. Bei Ablehnung bleiben lokale Vorschläge erhalten. In beiden Fällen mit `hm --proposals` oder `/proposals` Belege prüfen, zulässige Texte bearbeiten und ausdrücklich genehmigen oder ablehnen. Hinweise sind nur informativ. Veränderte Notizen oder veraltete Belege sperren die Freigabe; mit aktuellen Daten wiederholen.

    Den Wartungshinweis unter `hm --setup` → Gedächtnis für den Chatstart einschalten und speichern. Er erscheint, wenn heartbeat nie oder zuletzt vor über sieben Tagen lief. Er schlägt nur den Start vor: kein Hintergrunddienst, automatische KI-Aufrufe oder automatische Bereinigung. Anders als set_reminder verwaltet er keine datierten Notizen. Vergessen, Zusammenführen oder Archivieren fragt vorher und löscht alle erfassten Nachrichten und Vorschläge. Andere genehmigte Notizen und frühere KI-Protokolle bleiben. Eine Chatantwort kann diese Optionen nicht aktivieren, Analysen starten oder Änderungen für den Nutzer genehmigen.
  es: |-
    Dream propone nuevas memorias a partir de observaciones. Abre `hm --setup` → Memoria, activa las skills y la memoria del proyecto y, por separado, la captura con su consentimiento, y Guarda. Skills y Memoria comparten Guardar y Cancelar en el mismo formulario; Cancelar descarta el borrador. El flujo directo `hm --learning` sigue disponible. Completa consultas en al menos dos sesiones distintas; dos mensajes de una sesión no bastan. Ejecuta `hm --dream` o `/dream`. Lee el lote exacto de evidencias mostrado y decide si compartirlo con OpenAI. Solo se envía ese lote tras confirmar: hasta 24 observaciones completas dentro del límite de entrada. No se importa historial antiguo. OpenAI debe estar configurado y activado. Dream no trabaja de noche ni guarda memorias por su cuenta.

    Heartbeat mantiene las memorias existentes. Activa las skills y la memoria en `hm --setup` → Memoria, guarda y ejecuta `hm --heartbeat` o `/heartbeat`; no necesita captura de mensajes. Propone localmente fusionar duplicados exactos de la lista compartida, sin OpenAI. Después puedes aprobar por separado el envío del lote de notas mostrado para una revisión IA opcional, o rechazarlo conservando las propuestas locales. En ambos casos usa `hm --proposals` o `/proposals` para leer evidencias, editar los textos permitidos y aprobar o rechazar explícitamente. Las alertas son informativas. Notas modificadas o evidencias caducadas bloquean la aprobación; repite con datos actuales.

    Para el recordatorio de mantenimiento, abre `hm --setup` → Memoria, actívalo al iniciar chat y guarda. Aparece si heartbeat nunca se ejecutó o fue hace más de siete días. Solo sugiere ejecutarlo: no hay servicio de fondo, llamadas IA ni limpieza automática. Es distinto de las notas con fecha de set_reminder. Olvidar, fusionar o archivar una memoria pide confirmación y borra todos los mensajes recopilados y las sugerencias. Otras notas aprobadas y registros IA anteriores permanecen. Una respuesta del chat no puede activar opciones, ejecutar análisis ni aprobar cambios por el usuario.
  vi: |-
    Dream đề xuất ghi nhớ mới từ quan sát. Mở `hm --setup` → Bộ nhớ, bật kỹ năng và bộ nhớ cho dự án, bật riêng việc thu thập và xác nhận thông báo, rồi Lưu. Kỹ năng và Bộ nhớ dùng chung Lưu và Hủy trong một biểu mẫu; Hủy bỏ bản nháp. Quy trình trực tiếp `hm --learning` vẫn dùng được. Hoàn tất câu hỏi trong ít nhất hai phiên khác nhau; hai tin nhắn trong một phiên chưa đủ. Chạy `hm --dream` hoặc `/dream`. Đọc đúng nhóm bằng chứng hiển thị rồi quyết định có chia sẻ với OpenAI không. Chỉ nhóm đó được gửi sau xác nhận: tối đa 24 quan sát nguyên vẹn trong giới hạn đầu vào. Không nhập lịch sử cũ. OpenAI phải được cấu hình và bật sẵn. Dream không chạy ban đêm hay tự lưu ghi nhớ.

    Heartbeat bảo trì ghi nhớ hiện có. Bật kỹ năng và bộ nhớ tại `hm --setup` → Bộ nhớ, lưu rồi chạy `hm --heartbeat` hay `/heartbeat`; không cần thu thập tin nhắn. Nó đề xuất gộp bản trùng khớp hoàn toàn trong danh sách dùng chung ngay trên máy, không gọi OpenAI. Sau đó bạn có thể duyệt riêng nhóm ghi chú hiển thị cho đánh giá AI tùy chọn, hoặc từ chối mà vẫn giữ đề xuất cục bộ. Với cả hai quy trình, dùng `hm --proposals` hay `/proposals` để xem bằng chứng, sửa nội dung được phép và chủ động duyệt hoặc từ chối. Cảnh báo chỉ cung cấp thông tin. Ghi chú đã đổi hay bằng chứng hết hạn sẽ chặn phê duyệt; hãy chạy lại với dữ liệu mới.

    Để bật nhắc bảo trì, mở `hm --setup` → Bộ nhớ, bật nhắc khi bắt đầu chat và lưu. Nhắc xuất hiện nếu heartbeat chưa từng chạy hoặc lần cuối đã quá bảy ngày. Nó chỉ gợi ý chạy heartbeat: không có dịch vụ nền, gọi AI hay dọn dẹp tự động. Nó khác ghi chú có hạn giờ trong set_reminder. Quên, gộp hoặc lưu trữ ghi nhớ cần xác nhận và xóa mọi tin nhắn đã thu thập và đề xuất. Ghi chú đã duyệt khác và nhật ký AI cũ vẫn còn. Câu trả lời chat không thể bật tùy chọn, chạy phân tích hay duyệt thay người dùng.
