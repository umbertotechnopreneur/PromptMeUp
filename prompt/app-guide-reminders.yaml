id: app-guide-reminders
version: 2
description: Activate the reminder skill and manage local project reminders.
tags:
  - app-guide
  - reminders
  - set_reminder
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    To activate reminders, open `hm --setup` → Skills in the project, enable skills and memory, inspect the bundled `set_reminder` package, enable it, and Save. Skills and Memory share Save and Cancel; Cancel discards the draft. Then open `hm --skills` or `/skills`, select `set_reminder`, Choose an action, and `manage`. No upload, deployment, or learning capture is required. Selecting skill guidance alone does not create a reminder; chat requests such as "remind me at 3pm" are not scheduling commands.

    In the manager, choose New reminder, enter a time such as `14:30`, `3pm`, or `2030-05-20T14:30:00+02:00`, and write the note. The ISO date is only an example: choose your actual future date and offset. Review the full date, time, offset, and text before confirming. A clock time uses the computer's local zone and means tomorrow if it has already passed today. Ambiguous or missing daylight-saving times need an explicit ISO offset. Notes must be one line, at most 500 characters, with no credentials. Each project can keep 50 pending reminders. The manager lists them; select one and confirm to cancel it.

    Reminders stay local and survive restarts. They appear once when chat next reaches its input prompt in the same project, not while you type or while the app is closed. There is no background alarm, system notification, or OpenAI call. Displayed or cancelled reminders are deleted. Disabling the skill or the project's skills-and-memory switch pauses delivery without deleting pending reminders; reactivate the reviewed package to resume. Package changes need approval again. This is different from the weekly heartbeat maintenance hint, enabled in `hm --setup` → Memory and saved with the form. Explain the manual steps; never claim a reminder was created, cancelled, or enabled without an application-generated result.
  it: |-
    Per attivare i promemoria, apri `hm --setup` → Skills nel progetto, abilita skills e memoria, esamina il pacchetto incluso `set_reminder`, abilitalo e Salva. Skills e Memoria condividono Salva e Annulla; Annulla scarta la bozza. Poi apri `hm --skills` o `/skills`, seleziona `set_reminder`, Scegli un’azione e `manage`. Non servono caricamenti online, distribuzione né raccolta dei messaggi. Selezionare solo le istruzioni della skill non crea promemoria; frasi come "ricordamelo alle 15" non sono comandi di pianificazione.

    Nel gestore scegli Nuovo promemoria, inserisci un orario come `14:30`, `3pm` o `2030-05-20T14:30:00+02:00` e scrivi la nota. La data ISO è solo un esempio: scegli data futura e fuso reali. Controlla data, ora, scostamento e testo completi prima di confermare. Un semplice orario usa il fuso locale del computer e indica domani se oggi è già passato. Orari ambigui o inesistenti per il cambio d'ora richiedono una data ISO con scostamento esplicito. Le note devono avere una riga, massimo 500 caratteri e nessuna credenziale. Ogni progetto conserva fino a 50 promemoria in attesa. Il gestore li elenca; selezionane uno e conferma per annullarlo.

    Restano locali e sopravvivono ai riavvii. Compaiono una volta quando la chat raggiunge il prossimo prompt di input nello stesso progetto, non mentre scrivi o ad app chiusa. Nessuna sveglia in background, notifica di sistema o chiamata OpenAI. Quelli mostrati o annullati vengono eliminati. Disattivare la skill o l'interruttore skills e memoria del progetto sospende la consegna senza cancellare i promemoria: riattiva il pacchetto esaminato per riprendere. Modifiche al pacchetto richiedono nuova approvazione. È diverso dal suggerimento settimanale di manutenzione heartbeat, attivato in `hm --setup` → Memoria e salvato con la schermata. Spiega i passaggi manuali; mai dichiarare creazioni, annullamenti o attivazioni senza un risultato dell'app.
  fr: |-
    Pour activer les rappels, ouvrez `hm --setup` → Compétences dans le projet, activez les compétences et la mémoire, examinez le paquet fourni `set_reminder`, activez-le puis enregistrez. Compétences et Mémoire partagent Enregistrer et Annuler ; Annuler abandonne le brouillon. Ouvrez ensuite `hm --skills` ou `/skills`, sélectionnez `set_reminder`, Choisir une action, puis `manage`. Aucun téléversement, déploiement ni collecte d'apprentissage n'est requis. Sélectionner les instructions ne crée pas de rappel ; dire « rappelle-moi à 15 h » ne programme rien.

    Dans le gestionnaire, choisissez Nouveau rappel, entrez une heure comme `14:30`, `3pm` ou `2030-05-20T14:30:00+02:00`, puis la note. Cette date ISO est un exemple : choisissez une date future et un décalage réels. Vérifiez date, heure, décalage et texte complets avant de confirmer. Une heure seule utilise le fuseau local de l'ordinateur et signifie demain si elle est déjà passée aujourd'hui. Une heure ambiguë ou inexistante au changement d'heure exige une date ISO avec décalage explicite. Notes sur une ligne, 500 caractères maximum, sans identifiants secrets. Chaque projet peut garder 50 rappels en attente. Le gestionnaire les liste ; sélectionnez-en un puis confirmez pour l'annuler.

    Les rappels restent locaux et survivent aux redémarrages. Ils apparaissent une fois au prochain prompt de saisie du chat dans le même projet, pas pendant la frappe ni lorsque l'application est fermée. Aucune alarme de fond, notification système ou requête OpenAI. Les rappels affichés ou annulés sont supprimés. Désactiver la compétence ou l'option compétences et mémoire du projet suspend la livraison sans supprimer les rappels ; réactivez le paquet examiné pour reprendre. Toute modification du paquet exige une nouvelle approbation. Ce mécanisme diffère du rappel hebdomadaire heartbeat activé dans `hm --setup` → Mémoire puis enregistré avec le formulaire. Expliquez les étapes manuelles ; n'affirmez aucune création, annulation ou activation sans résultat de l'application.
  de: |-
    Für zeitgesteuerte Notizen im Projekt `hm --setup` → Skills öffnen, Skills und Gedächtnis aktivieren, das mitgelieferte Paket `set_reminder` prüfen, einschalten und speichern. Skills und Gedächtnis teilen Speichern und Abbrechen; Abbrechen verwirft den Entwurf. Danach `hm --skills` oder `/skills` öffnen, `set_reminder`, Aktion auswählen und `manage` wählen. Upload, Bereitstellung oder Lernerfassung sind nicht nötig. Nur die Skill-Hinweise auszuwählen erstellt keine Notiz; Sätze wie „erinnere mich um 15 Uhr“ sind keine Planungsbefehle.

    In der Verwaltung Neue Erinnerung wählen, eine Zeit wie `14:30`, `3pm` oder `2030-05-20T14:30:00+02:00` und den Text eingeben. Das ISO-Datum ist nur ein Beispiel; tatsächliches zukünftiges Datum und Offset wählen. Datum, Zeit, Offset und Text vollständig prüfen und bestätigen. Eine reine Uhrzeit nutzt die lokale Computerzeitzone und bedeutet morgen, wenn sie heute schon vorbei ist. Mehrdeutige oder fehlende Zeiten bei Zeitumstellungen erfordern ein ISO-Datum mit ausdrücklichem Offset. Notizen sind einzeilig, höchstens 500 Zeichen und ohne Zugangsdaten. Pro Projekt sind 50 offene Erinnerungen möglich. Die Verwaltung listet sie; eine auswählen und zum Löschen bestätigen.

    Erinnerungen bleiben lokal und überstehen Neustarts. Sie erscheinen einmal, wenn der Chat im selben Projekt seine nächste Eingabeaufforderung erreicht, nicht während des Tippens oder bei geschlossener App. Kein Hintergrundalarm, keine Systemmeldung und kein OpenAI-Aufruf. Angezeigte oder stornierte Einträge werden gelöscht. Den Skill oder den Projektschalter für Skills und Gedächtnis auszuschalten pausiert die Ausgabe, ohne offene Einträge zu löschen; das geprüfte Paket wieder aktivieren. Paketänderungen benötigen neue Freigabe. Das unterscheidet sich vom wöchentlichen heartbeat-Wartungshinweis unter `hm --setup` → Gedächtnis, der im Formular gespeichert wird. Die manuellen Schritte erklären; keine Erstellung, Stornierung oder Aktivierung ohne Anwendungsergebnis behaupten.
  es: |-
    Para activar recordatorios, abre `hm --setup` → Skills en el proyecto, activa las skills y la memoria, revisa el paquete incluido `set_reminder`, habilítalo y guarda. Skills y Memoria comparten Guardar y Cancelar; Cancelar descarta el borrador. Después abre `hm --skills` o `/skills`, selecciona `set_reminder`, Elegir acción y `manage`. No requiere subidas, despliegues ni captura de aprendizaje. Seleccionar solo las instrucciones de la skill no crea recordatorios; frases como «recuérdamelo a las 15» no son comandos de programación.

    En el gestor elige Nuevo recordatorio, introduce una hora como `14:30`, `3pm` o `2030-05-20T14:30:00+02:00` y escribe la nota. La fecha ISO es un ejemplo: elige una fecha futura y un desfase reales. Revisa fecha, hora, desfase y texto completos antes de confirmar. Una hora sola usa la zona local del equipo y significa mañana si ya pasó hoy. Las horas ambiguas o inexistentes por cambios de horario requieren una fecha ISO con desfase explícito. Las notas deben ocupar una línea, con hasta 500 caracteres y sin credenciales. Cada proyecto admite 50 recordatorios pendientes. El gestor los lista; selecciona uno y confirma para cancelarlo.

    Los recordatorios son locales y sobreviven a reinicios. Aparecen una vez cuando el chat llega al próximo prompt de entrada en el mismo proyecto, no mientras escribes ni con la aplicación cerrada. No hay alarma de fondo, notificación del sistema ni llamada a OpenAI. Los mostrados o cancelados se eliminan. Desactivar la skill o la opción de skills y memoria del proyecto pausa la entrega sin borrar pendientes; reactiva el paquete revisado para continuar. Cambiar el paquete exige nueva aprobación. Es distinto del aviso semanal de mantenimiento heartbeat activado en `hm --setup` → Memoria y guardado con el formulario. Explica los pasos manuales; no afirmes creación, cancelación o activación sin un resultado de la aplicación.
  vi: |-
    Để bật nhắc việc, mở `hm --setup` → Kỹ năng trong dự án, bật kỹ năng và bộ nhớ, xem gói đi kèm `set_reminder`, bật gói rồi Lưu. Kỹ năng và Bộ nhớ dùng chung Lưu và Hủy; Hủy bỏ bản nháp. Sau đó mở `hm --skills` hoặc `/skills`, chọn `set_reminder`, Chọn thao tác rồi `manage`. Không cần tải lên, triển khai hay thu thập để học. Chỉ chọn hướng dẫn kỹ năng không tạo nhắc việc; câu như “nhắc tôi lúc 15 giờ” không phải lệnh đặt lịch.

    Trong trình quản lý, chọn Lời nhắc mới, nhập giờ như `14:30`, `3pm` hoặc `2030-05-20T14:30:00+02:00` rồi viết ghi chú. Ngày ISO chỉ là ví dụ: chọn ngày tương lai và độ lệch múi giờ thực tế. Kiểm tra đầy đủ ngày, giờ, độ lệch và nội dung trước khi xác nhận. Chỉ nhập giờ sẽ dùng múi giờ của máy và hiểu là ngày mai nếu giờ đó đã qua hôm nay. Giờ không rõ hoặc không tồn tại do đổi giờ mùa hè cần ngày ISO với độ lệch rõ ràng. Ghi chú một dòng, tối đa 500 ký tự, không chứa thông tin đăng nhập. Mỗi dự án giữ tối đa 50 nhắc việc đang chờ. Trình quản lý liệt kê chúng; chọn một mục rồi xác nhận để hủy.

    Nhắc việc lưu cục bộ và tồn tại sau khi khởi động lại. Chúng hiện một lần khi chat tới lời nhắc nhập tiếp theo trong cùng dự án, không hiện khi bạn đang gõ hoặc ứng dụng đã đóng. Không có báo thức nền, thông báo hệ điều hành hay gọi OpenAI. Mục đã hiện hoặc bị hủy sẽ bị xóa. Tắt kỹ năng hoặc công tắc kỹ năng và bộ nhớ của dự án chỉ tạm dừng, không xóa mục đang chờ; bật lại gói đã kiểm tra để tiếp tục. Gói thay đổi cần duyệt lại. Đây không phải nhắc bảo trì heartbeat hằng tuần bật tại `hm --setup` → Bộ nhớ và lưu trong biểu mẫu. Hãy giải thích các bước thủ công; không khẳng định đã tạo, hủy hay bật khi chưa có kết quả từ ứng dụng.
