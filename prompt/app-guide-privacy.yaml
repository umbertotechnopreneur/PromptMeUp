id: app-guide-privacy
version: 4
description: Local storage, provider-bound content, credentials, and guide access boundaries.
tags:
  - app-guide
  - privacy
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    Settings → Privacy explains data use without changing anything. Skills and Memory are ordinary fields: Save applies their changes and Cancel discards them. Only the separate Saved memories manager saves its confirmed note changes immediately; cancelling Settings does not undo those notes.

    An optional name or nickname in `hm --setup` → Personalization is stored locally. If set, it is included only in OpenAI questions and chat, not automatic chat-control checks, command-risk reviews, Dream, heartbeat, or connection checks. It is never inferred from the OS, accounts, or memories. Clear the field and Save to stop adding the preference to future requests; this does not erase earlier conversation, audit history, or OpenAI records.

    Settings, saved notes, logs, and request history are stored locally. AI requests send the question, retained messages, selected notes, system instructions, selected local guide chapters, filtered runtime facts, and any command output the user shares for follow-up to OpenAI. Recognizable credentials are redacted before persistence and OpenAI-bound command output, but redaction cannot catch every private detail. Full local command previews remain available for the user's review. Never ask the user to paste a key into a command or save one as a note. Enter keys through Credentials or use the user's secret manager. On Windows setup can save the key for the current user; Linux and macOS setup entry is session-only. The guide reader accesses only packaged chapters with known topic IDs. It cannot browse arbitrary files, inspect current settings, search the web, or contact other users. `/forget` and `/clear` do not erase earlier audit records or usage.
  it: |-
    Impostazioni → Privacy spiega l’uso dei dati senza cambiare nulla. Skills e Memoria sono normali campi: Salva applica le modifiche e Annulla le scarta. Solo il gestore separato Ricordi salvati salva subito le modifiche confermate alle note; Annulla nelle impostazioni non le annulla.

    Il nome o soprannome facoltativo in `hm --setup` → Personalizzazione viene salvato localmente. Se impostato, è incluso solo nelle domande e chat OpenAI, non nei controlli automatici della chat, revisioni dei rischi dei comandi, Dream, heartbeat o verifiche della connessione. Non viene dedotto da sistema operativo, account o memorie. Svuota il campo e Salva per non aggiungere più la preferenza alle richieste future; conversazioni, registri precedenti e dati già inviati a OpenAI restano.

    Impostazioni, note salvate, log e cronologia delle richieste sono conservati localmente. Le richieste AI inviano a OpenAI domanda, messaggi conservati, note selezionate, istruzioni di sistema, capitoli locali selezionati della guida, dati filtrati dell'ambiente e output dei comandi che l'utente condivide per approfondimenti. Le credenziali riconoscibili vengono oscurate prima della persistenza e nell'output dei comandi destinato a OpenAI, ma il filtro non può riconoscere ogni dettaglio privato. Le anteprime locali complete dei comandi restano disponibili per la revisione dell'utente. Non chiedere mai di incollare una chiave in un comando o salvarla come nota. Inserisci le chiavi in Credenziali o usa il gestore di segreti dell'utente. Su Windows il setup può salvare la chiave per l'utente corrente; su Linux e macOS vale solo per la sessione. Il lettore della guida accede solo a capitoli inclusi nell'app con ID noti. Non può esplorare file arbitrari, leggere impostazioni attuali, cercare sul web o contattare altre persone. `/forget` e `/clear` non cancellano registrazioni precedenti o utilizzo.
  fr: |-
    Réglages → Confidentialité explique l’usage des données sans rien modifier. Compétences et Mémoire sont des champs ordinaires : Enregistrer applique les changements et Annuler les abandonne. Seul le gestionnaire séparé Souvenirs enregistrés sauvegarde immédiatement les changements confirmés aux notes ; Annuler les réglages ne les annule pas.

    Le nom ou surnom facultatif dans `hm --setup` → Personnalisation est stocké localement. Il accompagne seulement les questions et chats OpenAI, pas les contrôles automatiques du chat, avis de risque des commandes, Dream, heartbeat ou tests de connexion. Il n'est jamais déduit du système, des comptes ou des mémoires. Videz le champ et enregistrez pour cesser de l'ajouter aux requêtes futures ; conversations, anciennes traces et données déjà chez OpenAI restent.

    Réglages, notes, journaux et historique des requêtes sont stockés localement. Les requêtes IA envoient à OpenAI question, messages conservés, notes sélectionnées, instructions système, chapitres locaux sélectionnés, données d'exécution filtrées et sortie de commandes partagée pour un suivi. Les identifiants reconnaissables sont masqués avant stockage et dans la sortie envoyée à OpenAI, mais le filtre ne détecte pas tous les détails privés. Les aperçus locaux complets restent disponibles pour vérification. Ne demandez jamais de coller une clé dans une commande ni de l'enregistrer comme note. Saisissez les clés dans Identifiants ou utilisez le gestionnaire de secrets de l'utilisateur. Sous Windows, la configuration peut enregistrer la clé pour l'utilisateur courant ; sous Linux et macOS, la saisie vaut pour la session. Le lecteur du guide accède uniquement aux chapitres fournis avec des identifiants connus. Il ne peut parcourir d'autres fichiers, lire les réglages actuels, chercher sur le web ni contacter des personnes. `/forget` et `/clear` n'effacent pas les anciennes traces ni l'utilisation.
  de: |-
    Einstellungen → Datenschutz erklärt die Datennutzung, ohne etwas zu ändern. Skills und Gedächtnis sind normale Felder: Speichern übernimmt Änderungen, Abbrechen verwirft sie. Nur die getrennte Verwaltung Gespeicherte Erinnerungen speichert bestätigte Notizänderungen sofort; Abbrechen der Einstellungen macht diese nicht rückgängig.

    Der optionale Name oder Spitzname unter `hm --setup` → Personalisierung wird lokal gespeichert. Er wird nur bei OpenAI-Fragen und Chats mitgesendet, nicht bei automatischen Chatprüfungen, Befehlsrisikoprüfungen, Dream, heartbeat oder Verbindungstests. Er wird nie aus Betriebssystem, Konten oder Erinnerungen abgeleitet. Feld leeren und speichern beendet das Hinzufügen zu künftigen Anfragen; frühere Gespräche, Protokolle und Anbieterdaten bleiben erhalten.

    Einstellungen, Notizen, Protokolle und Anfrageverlauf werden lokal gespeichert. KI-Anfragen senden Frage, behaltene Nachrichten, ausgewählte Notizen, Systemanweisungen, ausgewählte lokale Anleitungskapitel, gefilterte Laufzeitdaten und vom Benutzer geteilte Befehlsausgabe an OpenAI. Erkennbare Zugangsdaten werden vor Speicherung und in an OpenAI gesendeter Befehlsausgabe maskiert; nicht jedes private Detail wird erkannt. Vollständige lokale Befehlsvorschauen bleiben zur Prüfung sichtbar. Fordere nie dazu auf, einen Schlüssel in einen Befehl einzufügen oder als Notiz zu speichern. Schlüssel gehören in Zugangsdaten oder den eigenen Geheimnisspeicher. Unter Windows kann die Einrichtung den Schlüssel für den aktuellen Benutzer speichern; unter Linux und macOS gilt die Eingabe nur für die Sitzung. Der Anleitungsleser lädt ausschließlich mitgelieferte Kapitel mit bekannten IDs. Er kann keine beliebigen Dateien durchsuchen, aktuellen Einstellungen lesen, im Web suchen oder Personen kontaktieren. `/forget` und `/clear` löschen keine früheren Protokolle oder Verbrauchsdaten.
  es: |-
    Configuración → Privacidad explica el uso de datos sin cambiar nada. Skills y Memoria son campos normales: Guardar aplica sus cambios y Cancelar los descarta. Solo el gestor separado Recuerdos guardados guarda inmediatamente los cambios confirmados en notas; Cancelar Configuración no los deshace.

    El nombre o apodo opcional de `hm --setup` → Personalización se guarda localmente. Solo acompaña preguntas y chat de OpenAI, no controles automáticos del chat, revisiones de riesgo de comandos, Dream, heartbeat ni pruebas de conexión. Nunca se deduce del sistema, cuentas o memorias. Vacía el campo y guarda para dejar de añadir la preferencia a futuras peticiones; conversaciones, registros anteriores y datos ya enviados a OpenAI permanecen.

    Ajustes, notas, registros e historial de peticiones se guardan localmente. Las peticiones IA envían a OpenAI pregunta, mensajes conservados, notas seleccionadas, instrucciones del sistema, capítulos locales elegidos, datos filtrados del entorno y salida de comandos compartida para continuar. Las credenciales reconocibles se ocultan antes de guardar y en la salida enviada a OpenAI, pero el filtro no detecta todos los detalles privados. Las vistas previas locales completas siguen disponibles para revisión. Nunca pidas pegar una clave en un comando ni guardarla como nota. Introduce las claves en Credenciales o usa el gestor de secretos del usuario. En Windows, la configuración puede guardar la clave para el usuario actual; en Linux y macOS, la entrada solo dura la sesión. El lector de guía accede únicamente a capítulos incluidos con identificadores conocidos. No puede explorar archivos arbitrarios, leer ajustes actuales, buscar en la web ni contactar personas. `/forget` y `/clear` no eliminan registros ni uso anteriores.
  vi: |-
    Cài đặt → Quyền riêng tư giải thích cách dùng dữ liệu mà không thay đổi gì. Kỹ năng và Bộ nhớ là các trường thông thường: Lưu áp dụng thay đổi, Hủy bỏ qua chúng. Chỉ trình quản lý Ghi nhớ đã lưu riêng lưu ngay các thay đổi ghi chú đã xác nhận; Hủy Cài đặt không hoàn tác các ghi chú đó.

    Tên hoặc biệt danh tùy chọn tại `hm --setup` → Cá nhân hóa được lưu cục bộ. Nếu đặt, nó chỉ đi cùng câu hỏi và chat OpenAI, không đi cùng kiểm tra điều khiển chat tự động, đánh giá rủi ro lệnh, Dream, heartbeat hay kiểm tra kết nối. Không suy ra tên từ hệ điều hành, tài khoản hoặc ghi nhớ. Xóa nội dung rồi Lưu để ngừng thêm lựa chọn vào yêu cầu sau; hội thoại, nhật ký cũ và dữ liệu đã gửi OpenAI vẫn còn.

    Cài đặt, ghi chú, nhật ký và lịch sử yêu cầu được lưu cục bộ. Yêu cầu AI gửi câu hỏi, tin nhắn được giữ, ghi chú được chọn, hướng dẫn hệ thống, chương tài liệu cục bộ đã chọn, dữ kiện môi trường đã lọc và đầu ra lệnh người dùng chia sẻ để hỏi tiếp đến OpenAI. Thông tin xác thực nhận diện được sẽ được che trước khi lưu và trong đầu ra gửi cho OpenAI, nhưng bộ lọc không nhận diện mọi chi tiết riêng tư. Bản xem trước lệnh đầy đủ vẫn hiển thị cục bộ để người dùng kiểm tra. Không yêu cầu dán khóa vào lệnh hay lưu làm ghi chú. Nhập khóa qua mục Thông tin xác thực hoặc dùng trình quản lý bí mật riêng. Trên Windows, thiết lập có thể lưu khóa cho người dùng hiện tại; trên Linux và macOS, khóa nhập chỉ dùng trong phiên. Trình đọc tài liệu chỉ truy cập chương đóng gói có ID đã biết. Nó không duyệt tệp tùy ý, đọc cài đặt hiện tại, tìm web hay liên hệ người khác. `/forget` và `/clear` không xóa bản ghi hoặc sử dụng trước đây.
