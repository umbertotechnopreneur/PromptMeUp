id: app-guide-settings
version: 1
description: Local settings navigation, saving, and personal preferences.
tags:
  - app-guide
  - settings
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    From a live terminal, `hm --setup` opens Settings at General, `hm --ai-setup` or `hm --ai-settings` at AI, and `hm --theme` at Theme. Use the sidebar to move between sections. General contains language; AI contains model, reasoning, output detail, optional advisory command review, and caching. Conversation contains chat limits. Commands contains execution timeout and captured-output limits. Credentials contains key replacement and the optional connection check. Personalization contains personal instructions and location preference. Save applies the whole draft; Cancel keeps existing settings. Saving alone makes no AI call; a connection check runs only when enabled. Give these as manual steps: leave chat with `/exit`, run the chosen settings command in the terminal, edit, and save. Never offer interactive settings commands in the response's commands array or through `/run`. Do not claim to inspect or change settings yourself.
  it: |-
    Da un terminale interattivo, `hm --setup` apre le Impostazioni su Generale, `hm --ai-setup` o `hm --ai-settings` su AI e `hm --theme` sul tema. Usa la barra laterale per cambiare sezione. Generale contiene la lingua; AI contiene modello, ragionamento, dettaglio delle risposte, revisione AI facoltativa dei comandi e cache. Conversazione contiene i limiti della chat. Comandi contiene durata massima e limite dell'output acquisito. Credenziali contiene sostituzione delle chiavi e verifica facoltativa della connessione. Personalizzazione contiene istruzioni personali e preferenza di posizione. Salva applica tutte le modifiche; Annulla conserva le impostazioni esistenti. Il solo salvataggio non chiama l'AI; la verifica della connessione parte solo se abilitata. Fornisci passaggi manuali: esci dalla chat con `/exit`, esegui il comando delle impostazioni nel terminale, modifica e salva. Non proporre comandi di impostazioni interattive nell'array commands o tramite `/run`. Non affermare di consultare o cambiare direttamente le impostazioni.
  fr: |-
    Dans un terminal interactif, `hm --setup` ouvre les réglages généraux, `hm --ai-setup` ou `hm --ai-settings` la section IA, et `hm --theme` le thème. La barre latérale permet de changer de section. Général contient la langue ; IA contient modèle, raisonnement, détail des réponses, avis IA facultatif sur les commandes et cache. Conversation contient les limites du chat. Commandes contient délai d'exécution et limite de sortie capturée. Identifiants contient remplacement des clés et test de connexion facultatif. Personnalisation contient instructions personnelles et préférence de localisation. Enregistrer applique toutes les modifications ; Annuler conserve les réglages existants. Enregistrer seul n'appelle pas l'IA ; le test de connexion ne se lance que s'il est activé. Donnez des étapes manuelles : quitter le chat avec `/exit`, lancer la commande de réglages dans le terminal, modifier puis enregistrer. Ne proposez jamais ces commandes interactives dans commands ni via `/run`. Ne prétendez pas consulter ou modifier vous-même les réglages.
  de: |-
    Im interaktiven Terminal öffnet `hm --setup` die allgemeinen Einstellungen, `hm --ai-setup` oder `hm --ai-settings` den KI-Bereich und `hm --theme` das Design. Über die Seitenleiste wechselt man Bereiche. Allgemein enthält die Sprache; KI enthält Modell, Denkaufwand, Antwortdetail, optionale beratende Befehlsprüfung und Cache. Unterhaltung enthält Chatlimits. Befehle enthält Laufzeit und Ausgabelimit. Zugangsdaten enthält Schlüsselwechsel und optionalen Verbindungstest. Personalisierung enthält persönliche Anweisungen und Standortpräferenz. Speichern übernimmt den gesamten Entwurf; Abbrechen behält bisherige Werte. Speichern allein ruft keine KI auf; der Verbindungstest läuft nur, wenn aktiviert. Beschreibe manuelle Schritte: Chat mit `/exit` verlassen, Einstellungsbefehl im Terminal starten, ändern und speichern. Biete interaktive Einstellungsbefehle niemals im commands-Array oder über `/run` an. Behaupte nicht, die Einstellungen selbst zu lesen oder zu ändern.
  es: |-
    Desde un terminal interactivo, `hm --setup` abre los ajustes generales, `hm --ai-setup` o `hm --ai-settings` la sección IA, y `hm --theme` el tema. La barra lateral permite cambiar de sección. General contiene el idioma; IA contiene modelo, razonamiento, detalle de respuesta, revisión orientativa opcional de comandos y caché. Conversación contiene los límites del chat. Comandos contiene tiempo de ejecución y límite de salida capturada. Credenciales contiene sustitución de claves y prueba de conexión opcional. Personalización contiene instrucciones personales y preferencia de ubicación. Guardar aplica todos los cambios; Cancelar conserva los ajustes anteriores. Guardar por sí solo no llama a la IA; la prueba solo se realiza si se activa. Da pasos manuales: salir del chat con `/exit`, ejecutar el comando de ajustes en el terminal, editar y guardar. Nunca propongas comandos de ajustes interactivos en commands ni mediante `/run`. No afirmes consultar o modificar los ajustes por tu cuenta.
  vi: |-
    Trong terminal tương tác, `hm --setup` mở cài đặt chung, `hm --ai-setup` hoặc `hm --ai-settings` mở mục AI, và `hm --theme` mở giao diện. Dùng thanh bên để đổi mục. Mục chung chứa ngôn ngữ; AI chứa mô hình, mức suy luận, độ chi tiết, đánh giá lệnh tùy chọn và bộ nhớ đệm. Hội thoại chứa giới hạn chat. Lệnh chứa thời gian chạy và giới hạn đầu ra. Thông tin xác thực chứa thay khóa và kiểm tra kết nối tùy chọn. Cá nhân hóa chứa hướng dẫn riêng và tùy chọn vị trí. Lưu áp dụng toàn bộ bản nháp; Hủy giữ cài đặt cũ. Chỉ lưu không gọi AI; kiểm tra kết nối chỉ chạy khi bật. Hãy hướng dẫn thao tác thủ công: thoát chat bằng `/exit`, chạy lệnh cài đặt trong terminal, sửa rồi lưu. Không đưa lệnh cài đặt tương tác vào mảng commands hoặc qua `/run`. Không khẳng định tự đọc hay thay đổi cài đặt.
