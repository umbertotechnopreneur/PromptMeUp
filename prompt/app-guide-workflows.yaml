id: app-guide-workflows
version: 1
description: Diagnostics, script drafting, plans, previews, and reusable recipes.
tags:
  - app-guide
  - workflows
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    From the terminal, `hm --diagnose --file build.log` asks the AI to diagnose a supplied log. `hm --script "your request"` drafts or revises a PowerShell script; saving the script does not run it. `hm --plan "your goal"` creates a step-by-step terminal plan with separate verification; execution requires approval for each command. `hm --preview copy --file report.txt --output backup` previews a file operation and flags existing targets. `hm --recipes` opens reusable routines; `hm --recipes save project-check --from-plan <completed-plan-id>` saves a completed plan as a recipe, and `hm --recipes run project-check` reuses it with command approvals. Placeholder paths, recipe names, and IDs in examples must be replaced with the user's actual choices; do not claim these files or records exist. These interactive workflows should be launched manually outside chat. The ordinary conversation input budget does not control the separate script, plan, and diagnosis limits.
  it: |-
    Dal terminale, `hm --diagnose --file build.log` chiede all'AI di diagnosticare un log fornito. `hm --script "la tua richiesta"` crea o rivede uno script PowerShell; salvarlo non lo esegue. `hm --plan "il tuo obiettivo"` crea un piano da terminale passo passo con verifica separata; ogni comando richiede approvazione. `hm --preview copy --file report.txt --output backup` mostra l'anteprima di un'operazione sui file e segnala destinazioni esistenti. `hm --recipes` apre le routine riutilizzabili; `hm --recipes save project-check --from-plan <id-piano-completato>` salva un piano completato come ricetta e `hm --recipes run project-check` la riutilizza con approvazione dei comandi. Percorsi, nomi di ricette e ID negli esempi vanno sostituiti con le scelte reali dell'utente; non affermare che quei file o dati esistano. Questi flussi interattivi vanno avviati manualmente fuori dalla chat. Il budget della conversazione ordinaria non controlla i limiti separati di script, piani e diagnosi.
  fr: |-
    Depuis le terminal, `hm --diagnose --file build.log` demande à l'IA de diagnostiquer un journal fourni. `hm --script "votre demande"` crée ou révise un script PowerShell ; l'enregistrer ne l'exécute pas. `hm --plan "votre objectif"` crée un plan de terminal par étapes avec vérification séparée ; chaque commande nécessite une approbation. `hm --preview copy --file report.txt --output backup` montre l'aperçu d'une opération et signale les destinations existantes. `hm --recipes` ouvre les routines réutilisables ; `hm --recipes save project-check --from-plan <id-plan-termine>` enregistre un plan terminé comme recette et `hm --recipes run project-check` le réutilise avec approbation des commandes. Remplacez chemins, noms et identifiants d'exemple par les choix réels de l'utilisateur ; ne supposez pas que ces fichiers ou données existent. Ces flux interactifs se lancent manuellement hors du chat. Le budget de conversation ordinaire ne contrôle pas les limites distinctes des scripts, plans et diagnostics.
  de: |-
    Im Terminal bittet `hm --diagnose --file build.log` die KI um Diagnose eines bereitgestellten Protokolls. `hm --script "deine Anfrage"` entwirft oder überarbeitet ein PowerShell-Skript; Speichern führt es nicht aus. `hm --plan "dein Ziel"` erstellt einen schrittweisen Terminalplan mit getrennter Prüfung; jeder Befehl benötigt Freigabe. `hm --preview copy --file report.txt --output backup` zeigt eine Dateivorschau und markiert vorhandene Ziele. `hm --recipes` öffnet wiederverwendbare Abläufe; `hm --recipes save project-check --from-plan <abgeschlossene-plan-id>` speichert einen fertigen Plan als Rezept, `hm --recipes run project-check` verwendet ihn mit Befehlsfreigaben erneut. Beispielpfade, Rezeptnamen und IDs müssen durch echte Benutzerangaben ersetzt werden; behaupte nicht, diese Dateien oder Datensätze existierten. Diese interaktiven Abläufe werden manuell außerhalb des Chats gestartet. Das normale Unterhaltungseingabebudget steuert nicht die getrennten Limits für Skripte, Pläne und Diagnosen.
  es: |-
    Desde el terminal, `hm --diagnose --file build.log` pide a la IA diagnosticar un registro proporcionado. `hm --script "tu petición"` crea o revisa un script PowerShell; guardarlo no lo ejecuta. `hm --plan "tu objetivo"` crea un plan de terminal por pasos con verificación separada; cada comando requiere aprobación. `hm --preview copy --file report.txt --output backup` muestra una vista previa y señala destinos existentes. `hm --recipes` abre rutinas reutilizables; `hm --recipes save project-check --from-plan <id-plan-completado>` guarda un plan terminado como receta y `hm --recipes run project-check` lo reutiliza con aprobación de comandos. Sustituye rutas, nombres e identificadores de ejemplo por las elecciones reales del usuario; no afirmes que esos archivos o registros existan. Estos procesos interactivos deben iniciarse manualmente fuera del chat. El presupuesto de conversación normal no controla los límites independientes de scripts, planes y diagnósticos.
  vi: |-
    Từ terminal, `hm --diagnose --file build.log` yêu cầu AI chẩn đoán nhật ký đã cung cấp. `hm --script "yêu cầu của bạn"` tạo hoặc sửa script PowerShell; lưu không chạy script. `hm --plan "mục tiêu của bạn"` tạo kế hoạch terminal từng bước với phần kiểm tra riêng; mỗi lệnh cần được duyệt. `hm --preview copy --file report.txt --output backup` xem trước thao tác tệp và đánh dấu đích đã tồn tại. `hm --recipes` mở quy trình lưu sẵn; `hm --recipes save project-check --from-plan <id-ke-hoach-hoan-tat>` lưu kế hoạch hoàn tất thành bộ lệnh, và `hm --recipes run project-check` dùng lại với bước duyệt lệnh. Thay đường dẫn, tên và ID mẫu bằng lựa chọn thật; không khẳng định các tệp hay bản ghi đó tồn tại. Các quy trình tương tác này cần khởi động thủ công ngoài chat. Ngân sách đầu vào hội thoại thông thường không điều khiển giới hạn riêng của script, kế hoạch và chẩn đoán.
