id: app-guide-learning
version: 2
description: Enable learning, inspect captured messages, and review proposed memories.
tags:
  - app-guide
  - learning
  - proposals
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    You can also open Settings (`hm --setup`) → Learning. Opening it does not enable the experiment or capture. Confirmed changes save immediately; Settings Cancel cannot undo them. Dream and heartbeat use saved AI, model, and credentials, not the Settings draft. Returning refreshes saved project status.

    To activate learning, open `hm --learning` in your project, choose Enable experiment for this project if asked, then toggle capture of future user messages and confirm. These are two separate opt-ins; enabling skills alone does not enable capture. `/learning` opens the same screen in chat. Activation means enabling a local feature, not publishing or deploying anything.

    Capture keeps filtered messages you write in future completed conversations or questions, not old chat history, AI replies, or file/command follow-ups. It keeps the newest 200 observations per project for 30 days; messages over 4,000 characters are skipped. In Learning, choose Captured observations to read a message and confirm its deletion, or Clear captured observations and proposals to clear them all. Disabling capture or the experiment clears that project's observations and proposals, not approved memories.

    After Dream or heartbeat, open `hm --proposals` or `/proposals`. Select a suggestion to read evidence and before/after text. Add and merge text can be edited; new notes can use project or global scope. Approve explicitly or reject. Flags only highlight issues and cannot change memories. Expired evidence or changed target notes invalidate a proposal; run the analysis again. Nothing is saved automatically. To save directly, use `/remember [global|project] <text>`; `hm --memories` manages saved notes. These manual memory features need neither the experiment nor capture; see the memories chapter. Never store secrets. Explain these steps; a chat answer cannot enable capture, approve proposals, or claim a save without an application result.
  it: |-
    Puoi anche aprire Impostazioni (`hm --setup`) → Apprendimento. Aprirla non abilita esperimento o raccolta. Le modifiche confermate sono salvate subito: Annulla nelle Impostazioni non le annulla. Dream e heartbeat usano AI, modello e credenziali salvati, non la bozza. Tornando si aggiorna lo stato salvato del progetto.

    Per attivare l'apprendimento, apri `hm --learning` nel progetto, scegli Abilita esperimento per questo progetto se richiesto, poi attiva la raccolta dei messaggi futuri e conferma. Sono due consensi separati: abilitare le skills non attiva la raccolta. `/learning` apre la stessa schermata in chat. Attivare significa abilitare una funzione locale, non pubblicare né distribuire nulla.

    La raccolta conserva messaggi filtrati scritti da te in future conversazioni o domande completate, non la vecchia cronologia, le risposte AI o i seguiti di file/comandi. Mantiene le ultime 200 osservazioni per progetto per 30 giorni; salta messaggi oltre 4.000 caratteri. In Apprendimento, scegli Osservazioni raccolte per leggere un messaggio e confermarne l'eliminazione, oppure Cancella osservazioni e proposte per rimuoverle tutte. Disabilitare raccolta o esperimento cancella osservazioni e proposte del progetto, non le memorie approvate.

    Dopo Dream o heartbeat, apri `hm --proposals` o `/proposals`. Scegli una proposta per leggere evidenze e testo prima/dopo. Puoi modificare aggiunte e unioni; per nuove note scegli ambito progetto o globale. Approva esplicitamente oppure rifiuta. Le segnalazioni non modificano memorie. Evidenze scadute o note cambiate invalidano la proposta: ripeti l'analisi. Nulla viene salvato automaticamente. Per salvare direttamente usa `/remember [global|project] <testo>`; `hm --memories` gestisce le note. Queste funzioni manuali non richiedono esperimento né raccolta: vedi il capitolo memorie. Mai salvare segreti. Spiega i passaggi: una risposta in chat non può attivare raccolta, approvare proposte o dichiarare salvataggi senza un risultato dell'app.
  fr: |-
    Autre accès : Réglages (`hm --setup`) → Apprentissage. L'ouverture n'active ni expérience ni collecte. Les changements confirmés sont enregistrés immédiatement ; Annuler les réglages ne les annule pas. Dream et heartbeat utilisent IA, modèle et identifiants enregistrés, pas le brouillon. Le retour actualise l'état enregistré du projet.

    Pour activer l'apprentissage, ouvrez `hm --learning` dans votre projet, choisissez Activer pour ce projet si demandé, puis activez la collecte des futurs messages et confirmez. Ce sont deux consentements distincts : activer des skills n'active pas la collecte. `/learning` ouvre le même écran dans le chat. Activer une fonction locale ne publie ni ne déploie quoi que ce soit.

    La collecte conserve vos messages filtrés de futures conversations ou questions terminées, pas l'ancien historique, les réponses IA ou les suivis de fichiers/commandes. Elle garde les 200 dernières observations par projet pendant 30 jours ; les messages dépassant 4 000 caractères sont ignorés. Dans Apprentissage, choisissez Observations collectées pour lire un message et confirmer sa suppression, ou Effacer observations et propositions pour tout retirer. Désactiver la collecte ou l'expérience efface observations et propositions du projet, pas les mémoires approuvées.

    Après Dream ou heartbeat, ouvrez `hm --proposals` ou `/proposals`. Choisissez une proposition pour lire les preuves et le texte avant/après. Ajouts et fusions sont modifiables ; les nouvelles notes peuvent être locales au projet ou globales. Approuvez explicitement ou rejetez. Les signalements ne modifient rien. Preuves expirées ou notes modifiées invalident la proposition : relancez l'analyse. Rien n'est enregistré automatiquement. Pour enregistrer directement, utilisez `/remember [global|project] <texte>` ; `hm --memories` gère les notes. Ces fonctions manuelles ne nécessitent ni expérience ni collecte ; voir le chapitre mémoires. Jamais de secrets. Expliquez ces étapes : le chat ne peut ni activer la collecte, ni approuver, ni affirmer un enregistrement sans résultat de l'application.
  de: |-
    Auch über Einstellungen (`hm --setup`) → Lernen erreichbar. Öffnen aktiviert weder Experiment noch Erfassung. Bestätigte Änderungen werden sofort gespeichert; Abbrechen der Einstellungen nimmt sie nicht zurück. Dream und heartbeat nutzen gespeicherte KI-, Modell- und Zugangsdaten, nicht den Entwurf. Bei Rückkehr wird der gespeicherte Projektstatus aktualisiert.

    Zum Aktivieren im Projekt `hm --learning` öffnen, gegebenenfalls Experiment für dieses Projekt aktivieren wählen, dann die Erfassung künftiger Nutzernachrichten einschalten und bestätigen. Das sind zwei getrennte Zustimmungen; Skills zu aktivieren schaltet die Erfassung nicht ein. `/learning` öffnet dieselbe Ansicht im Chat. Aktivieren bedeutet eine lokale Funktion einzuschalten, nicht sie zu veröffentlichen oder bereitzustellen.

    Erfasst werden bereinigte eigene Nachrichten aus künftig abgeschlossenen Gesprächen oder Anfragen, nicht alte Verläufe, KI-Antworten oder Folgeanfragen zu Dateien/Befehlen. Die neuesten 200 Beobachtungen pro Projekt bleiben 30 Tage erhalten; Nachrichten über 4.000 Zeichen werden übersprungen. Unter Lernen mit Erfasste Beobachtungen eine Nachricht lesen und ihre Löschung bestätigen; Beobachtungen und Vorschläge löschen entfernt alle. Erfassung oder Experiment auszuschalten löscht Beobachtungen und Vorschläge des Projekts, nicht genehmigte Erinnerungen.

    Nach Dream oder heartbeat `hm --proposals` oder `/proposals` öffnen. Einen Vorschlag wählen und Belege sowie Vorher/Nachher lesen. Neue und zusammengeführte Texte sind bearbeitbar; neue Notizen können projektbezogen oder global sein. Ausdrücklich genehmigen oder ablehnen. Hinweise ändern nichts. Abgelaufene Belege oder geänderte Notizen machen Vorschläge ungültig; erneut analysieren. Nichts wird automatisch gespeichert. Direktes Speichern geht mit `/remember [global|project] <Text>`; `hm --memories` verwaltet Notizen. Diese manuellen Funktionen brauchen weder Experiment noch Erfassung; siehe Kapitel Erinnerungen. Keine Geheimnisse speichern. Die Schritte erklären: Eine Chatantwort kann keine Erfassung aktivieren, Vorschläge genehmigen oder ohne Anwendungsergebnis eine Speicherung behaupten.
  es: |-
    También puedes abrir Ajustes (`hm --setup`) → Aprendizaje. Abrir no activa experimento ni captura. Los cambios confirmados se guardan de inmediato; Cancelar en Ajustes no los deshace. Dream y heartbeat usan IA, modelo y credenciales guardados, no el borrador. Al volver se actualiza el estado guardado del proyecto.

    Para activar el aprendizaje, abre `hm --learning` en tu proyecto, elige Activar experimento para este proyecto si se solicita, después activa la captura de futuros mensajes y confirma. Son dos consentimientos distintos: activar skills no activa la captura. `/learning` abre la misma pantalla en el chat. Activar una función local no significa publicarla ni desplegarla.

    La captura conserva mensajes filtrados que escribas en futuras conversaciones o consultas completadas, no el historial antiguo, respuestas de la IA ni seguimientos de archivos/comandos. Guarda las últimas 200 observaciones por proyecto durante 30 días; omite mensajes de más de 4.000 caracteres. En Aprendizaje, elige Observaciones capturadas para leer un mensaje y confirmar su eliminación, o Borrar observaciones y propuestas para quitarlas todas. Desactivar captura o experimento borra observaciones y propuestas del proyecto, no las memorias aprobadas.

    Tras Dream o heartbeat, abre `hm --proposals` o `/proposals`. Elige una propuesta para leer evidencias y texto antes/después. Puedes editar adiciones y fusiones; las notas nuevas admiten ámbito de proyecto o global. Aprueba explícitamente o rechaza. Las alertas no cambian memorias. Evidencias caducadas o notas modificadas invalidan la propuesta: repite el análisis. Nada se guarda automáticamente. Para guardar directamente usa `/remember [global|project] <texto>`; `hm --memories` administra notas. Estas funciones manuales no requieren experimento ni captura; consulta el capítulo de memorias. Nunca guardes secretos. Explica los pasos: el chat no puede activar captura, aprobar propuestas ni afirmar que guardó notas sin un resultado de la aplicación.
  vi: |-
    Có thể mở Cài đặt (`hm --setup`) → Học hỏi. Mở không bật thử nghiệm hoặc thu thập. Thay đổi đã xác nhận được lưu ngay; Hủy Cài đặt không hoàn tác chúng. Dream và heartbeat dùng AI, mô hình và thông tin xác thực đã lưu, không dùng bản nháp. Khi quay lại, trạng thái dự án đã lưu được cập nhật.

    Để bật tính năng học, mở `hm --learning` trong dự án, chọn Bật thử nghiệm cho dự án này nếu được hỏi, rồi bật lưu tin nhắn người dùng sắp tới và xác nhận. Đây là hai lựa chọn riêng: bật kỹ năng không bật thu thập. `/learning` mở cùng màn hình trong chat. Bật nghĩa là kích hoạt chức năng cục bộ, không phải xuất bản hay triển khai lên mạng.

    Thu thập lưu tin nhắn đã lọc do bạn viết trong các cuộc trò chuyện hoặc câu hỏi hoàn tất sau này, không lấy lịch sử cũ, câu trả lời AI hay trao đổi tiếp về tệp/lệnh. Giữ 200 quan sát mới nhất mỗi dự án trong 30 ngày; bỏ qua tin nhắn quá 4.000 ký tự. Trong Học, chọn Quan sát đã lưu để đọc và xác nhận xóa một tin nhắn, hoặc Xóa quan sát và đề xuất để xóa tất cả. Tắt thu thập hoặc thử nghiệm sẽ xóa quan sát và đề xuất của dự án, không xóa ghi nhớ đã duyệt.

    Sau Dream hoặc heartbeat, mở `hm --proposals` hay `/proposals`. Chọn đề xuất để đọc bằng chứng và nội dung trước/sau. Có thể sửa nội dung thêm hoặc gộp; ghi chú mới có phạm vi dự án hoặc toàn cục. Chủ động duyệt hoặc từ chối. Cảnh báo không sửa ghi nhớ. Bằng chứng hết hạn hoặc ghi chú đã đổi làm đề xuất mất hiệu lực; chạy lại phân tích. Không tự lưu gì. Để lưu trực tiếp, dùng `/remember [global|project] <nội dung>`; `hm --memories` quản lý ghi chú. Các chức năng thủ công này không cần bật thử nghiệm hay thu thập; xem chương bộ nhớ. Không lưu bí mật. Hãy giải thích các bước: câu trả lời chat không thể bật thu thập, duyệt đề xuất hoặc khẳng định đã lưu khi chưa có kết quả từ ứng dụng.
