id: app-guide-learning
version: 3
description: Enable learning, inspect captured messages, and review proposed memories.
tags:
  - app-guide
  - learning
  - proposals
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    The section is now called Memory; `--learning`, `/learning`, and the guide topic ID stay unchanged. Open `hm --setup` → Memory. Turn on the shared Skills and memory switch, separately choose to keep your messages, read the notice, give collection consent, and Save. Cancel discards the draft. Enabling the project switch alone never starts collection.

    Collection is optional and local. The reminder to review saved memories is a separate field in Memory and uses the same Save/Cancel. `hm --learning` or `/learning` still opens the direct controls for collection and for reading or deleting collected messages. Dream and heartbeat are started separately, never by saving Settings.

    Only future messages you write in completed exchanges are collected, not old history, AI replies, or file and command follow-ups. Keep at most the newest 200 per project; messages over 4,000 characters are skipped. Messages and suggestions older than 30 days are removed when these records are next used. `hm --learning` lets you read collected messages or delete them and their suggestions. Turning off collection or the shared switch clears collected messages and suggestions, not saved memories; Settings asks for deletion consent before Save.

    After Dream or heartbeat, open `hm --proposals` or `/proposals`. Select a suggestion to read evidence and before/after text. Add and merge text can be edited; new notes can use project or global scope. Approve explicitly or reject. Flags only highlight issues and cannot change memories. Expired evidence or changed target notes invalidate a proposal; run the analysis again. Nothing is saved automatically. To save directly, use `/remember [global|project] <text>`; `hm --memories` manages saved notes. These manual memory features need neither the Skills and memory switch nor collection; see the memories chapter. Never store secrets. Explain these steps; a chat answer cannot enable capture, approve proposals, or claim a save without an application result.
  it: |-
    La sezione si chiama ora Memoria; `--learning`, `/learning` e l’ID del capitolo restano invariati. Apri `hm --setup` → Memoria. Attiva Skills e memoria per il progetto, scegli separatamente di conservare i tuoi messaggi, leggi l’avviso, dai il consenso alla raccolta e Salva. Annulla scarta la bozza. Il solo interruttore del progetto non avvia mai la raccolta.

    La raccolta è facoltativa e locale. Il promemoria per rivedere i ricordi è un campo separato in Memoria e usa lo stesso Salva/Annulla. `hm --learning` o `/learning` apre ancora i controlli diretti della raccolta e dei messaggi da leggere o cancellare. Dream e heartbeat si avviano separatamente, mai salvando le impostazioni.

    Si raccolgono solo i messaggi che scrivi nei futuri scambi completati, non la vecchia cronologia, le risposte AI o i risultati di file e comandi. Restano al massimo i 200 più recenti per progetto; quelli oltre 4.000 caratteri vengono saltati. Messaggi e suggerimenti oltre 30 giorni vengono rimossi al prossimo uso di questi dati. `hm --learning` permette di leggere i messaggi raccolti o cancellarli con i suggerimenti. Disattivare la raccolta o l’interruttore comune cancella messaggi raccolti e suggerimenti, non i ricordi salvati; le impostazioni chiedono conferma prima di Salva.

    Dopo Dream o heartbeat, apri `hm --proposals` o `/proposals`. Scegli una proposta per leggere evidenze e testo prima/dopo. Puoi modificare aggiunte e unioni; per nuove note scegli ambito progetto o globale. Approva esplicitamente oppure rifiuta. Le segnalazioni non modificano memorie. Evidenze scadute o note cambiate invalidano la proposta: ripeti l'analisi. Nulla viene salvato automaticamente. Per salvare direttamente usa `/remember [global|project] <testo>`; `hm --memories` gestisce le note. Queste funzioni manuali non richiedono Skills e memoria né raccolta: vedi il capitolo memorie. Mai salvare segreti. Spiega i passaggi: una risposta in chat non può attivare raccolta, approvare proposte o dichiarare salvataggi senza un risultato dell'app.
  fr: |-
    La section s’appelle désormais Mémoire ; `--learning`, `/learning` et l’ID du chapitre restent inchangés. Ouvrez `hm --setup` → Mémoire. Activez Compétences et mémoire pour le projet, choisissez séparément de conserver vos messages, lisez l’avis, acceptez la collecte puis Enregistrer. Annuler abandonne le brouillon. L’interrupteur du projet seul ne lance jamais la collecte.

    La collecte est facultative et locale. Le rappel pour examiner les souvenirs est un champ séparé dans Mémoire et utilise le même Enregistrer/Annuler. `hm --learning` ou `/learning` ouvre toujours les contrôles directs de collecte et les messages à lire ou supprimer. Dream et heartbeat se lancent séparément, jamais en enregistrant les réglages.

    Seuls vos futurs messages dans des échanges terminés sont collectés, pas l’ancien historique, les réponses IA ni les résultats de fichiers ou commandes. Au plus les 200 derniers par projet sont conservés ; ceux de plus de 4 000 caractères sont ignorés. Messages et suggestions de plus de 30 jours sont supprimés à la prochaine utilisation de ces données. `hm --learning` permet de lire ou supprimer les messages collectés et leurs suggestions. Désactiver la collecte ou l’interrupteur commun supprime messages et suggestions, pas les souvenirs enregistrés ; les réglages demandent confirmation avant Enregistrer.

    Après Dream ou heartbeat, ouvrez `hm --proposals` ou `/proposals`. Choisissez une proposition pour lire les preuves et le texte avant/après. Ajouts et fusions sont modifiables ; les nouvelles notes peuvent être locales au projet ou globales. Approuvez explicitement ou rejetez. Les signalements ne modifient rien. Preuves expirées ou notes modifiées invalident la proposition : relancez l'analyse. Rien n'est enregistré automatiquement. Pour enregistrer directement, utilisez `/remember [global|project] <texte>` ; `hm --memories` gère les notes. Ces fonctions manuelles ne nécessitent ni Compétences et mémoire ni collecte ; voir le chapitre mémoires. Jamais de secrets. Expliquez ces étapes : le chat ne peut ni activer la collecte, ni approuver, ni affirmer un enregistrement sans résultat de l'application.
  de: |-
    Der Abschnitt heißt jetzt Gedächtnis; `--learning`, `/learning` und die Kapitel-ID bleiben unverändert. Öffne `hm --setup` → Gedächtnis. Aktiviere Skills und Gedächtnis für das Projekt, wähle die Nachrichtenerfassung separat, lies den Hinweis, bestätige die Erfassung und wähle Speichern. Abbrechen verwirft den Entwurf. Der Projektschalter allein startet nie die Erfassung.

    Die Erfassung ist freiwillig und lokal. Die Erinnerung zur Prüfung gespeicherter Notizen ist ein eigenes Feld unter Gedächtnis mit demselben Speichern/Abbrechen. `hm --learning` oder `/learning` öffnet weiterhin direkte Erfassungsoptionen und Nachrichten zum Lesen oder Löschen. Dream und Heartbeat werden separat gestartet, niemals durch Speichern der Einstellungen.

    Erfasst werden nur deine künftigen Nachrichten in abgeschlossenen Austauschen, nicht alter Verlauf, KI-Antworten oder Datei- und Befehlsausgaben. Je Projekt bleiben höchstens die neuesten 200; Nachrichten über 4.000 Zeichen werden ausgelassen. Nachrichten und Vorschläge über 30 Tage werden bei der nächsten Nutzung dieser Daten entfernt. Mit `hm --learning` kannst du erfasste Nachrichten lesen oder samt Vorschlägen löschen. Ausschalten der Erfassung oder des gemeinsamen Schalters löscht Nachrichten und Vorschläge, nicht gespeicherte Erinnerungen; Einstellungen verlangen vor Speichern eine Löschbestätigung.

    Nach Dream oder heartbeat `hm --proposals` oder `/proposals` öffnen. Einen Vorschlag wählen und Belege sowie Vorher/Nachher lesen. Neue und zusammengeführte Texte sind bearbeitbar; neue Notizen können projektbezogen oder global sein. Ausdrücklich genehmigen oder ablehnen. Hinweise ändern nichts. Abgelaufene Belege oder geänderte Notizen machen Vorschläge ungültig; erneut analysieren. Nichts wird automatisch gespeichert. Direktes Speichern geht mit `/remember [global|project] <Text>`; `hm --memories` verwaltet Notizen. Diese manuellen Funktionen brauchen weder Skills und Gedächtnis noch Erfassung; siehe Kapitel Erinnerungen. Keine Geheimnisse speichern. Die Schritte erklären: Eine Chatantwort kann keine Erfassung aktivieren, Vorschläge genehmigen oder ohne Anwendungsergebnis eine Speicherung behaupten.
  es: |-
    La sección ahora se llama Memoria; `--learning`, `/learning` y el ID del capítulo no cambian. Abre `hm --setup` → Memoria. Activa Skills y memoria para el proyecto, elige por separado conservar tus mensajes, lee el aviso, acepta la recopilación y elige Guardar. Cancelar descarta el borrador. El interruptor del proyecto por sí solo nunca inicia la recopilación.

    La recopilación es opcional y local. El recordatorio para revisar recuerdos es un campo separado de Memoria y usa el mismo Guardar/Cancelar. `hm --learning` o `/learning` sigue abriendo los controles directos y los mensajes para leer o borrar. Dream y heartbeat se inician por separado, nunca al guardar Configuración.

    Solo se recopilan tus mensajes futuros en intercambios completados, no el historial antiguo, las respuestas IA ni los resultados de archivos o comandos. Se guardan como máximo los 200 más recientes por proyecto; se omiten los de más de 4.000 caracteres. Los mensajes y sugerencias de más de 30 días se borran al volver a usar estos datos. `hm --learning` permite leer mensajes recopilados o borrarlos con sus sugerencias. Desactivar la recopilación o el interruptor común borra mensajes y sugerencias, no recuerdos guardados; Configuración pide confirmar el borrado antes de Guardar.

    Tras Dream o heartbeat, abre `hm --proposals` o `/proposals`. Elige una propuesta para leer evidencias y texto antes/después. Puedes editar adiciones y fusiones; las notas nuevas admiten ámbito de proyecto o global. Aprueba explícitamente o rechaza. Las alertas no cambian memorias. Evidencias caducadas o notas modificadas invalidan la propuesta: repite el análisis. Nada se guarda automáticamente. Para guardar directamente usa `/remember [global|project] <texto>`; `hm --memories` administra notas. Estas funciones manuales no requieren Skills y memoria ni captura; consulta el capítulo de memorias. Nunca guardes secretos. Explica los pasos: el chat no puede activar captura, aprobar propuestas ni afirmar que guardó notas sin un resultado de la aplicación.
  vi: |-
    Mục này nay có tên Bộ nhớ; `--learning`, `/learning` và ID chương không đổi. Mở `hm --setup` → Bộ nhớ. Bật Kỹ năng và bộ nhớ cho dự án, chọn riêng việc giữ tin nhắn, đọc thông báo, đồng ý thu thập rồi Lưu. Hủy bỏ qua bản nháp. Chỉ bật công tắc dự án không bao giờ bắt đầu thu thập.

    Thu thập là tùy chọn và chỉ lưu cục bộ. Nhắc kiểm tra ghi nhớ là trường riêng trong Bộ nhớ và dùng cùng Lưu/Hủy. `hm --learning` hoặc `/learning` vẫn mở điều khiển trực tiếp để thu thập, đọc hoặc xóa tin nhắn. Dream và heartbeat được khởi chạy riêng, không bao giờ chỉ vì lưu Cài đặt.

    Chỉ thu thập tin nhắn bạn viết trong các lượt trao đổi hoàn tất sau này, không lấy lịch sử cũ, câu trả lời AI hay kết quả tệp và lệnh. Mỗi dự án giữ tối đa 200 tin nhắn mới nhất; bỏ qua tin dài hơn 4.000 ký tự. Tin nhắn và đề xuất quá 30 ngày được xóa khi dùng lại dữ liệu này. `hm --learning` cho phép đọc hoặc xóa tin nhắn đã thu thập cùng đề xuất. Tắt thu thập hoặc công tắc chung xóa tin nhắn và đề xuất, không xóa ghi nhớ đã lưu; Cài đặt yêu cầu xác nhận xóa trước khi Lưu.

    Sau Dream hoặc heartbeat, mở `hm --proposals` hay `/proposals`. Chọn đề xuất để đọc bằng chứng và nội dung trước/sau. Có thể sửa nội dung thêm hoặc gộp; ghi chú mới có phạm vi dự án hoặc toàn cục. Chủ động duyệt hoặc từ chối. Cảnh báo không sửa ghi nhớ. Bằng chứng hết hạn hoặc ghi chú đã đổi làm đề xuất mất hiệu lực; chạy lại phân tích. Không tự lưu gì. Để lưu trực tiếp, dùng `/remember [global|project] <nội dung>`; `hm --memories` quản lý ghi chú. Các chức năng thủ công này không cần bật Kỹ năng và bộ nhớ hay thu thập; xem chương bộ nhớ. Không lưu bí mật. Hãy giải thích các bước: câu trả lời chat không thể bật thu thập, duyệt đề xuất hoặc khẳng định đã lưu khi chưa có kết quả từ ứng dụng.
