id: app-guide-memories
version: 4
description: Explicit saved notes, local management, selection limits, and deletion.
tags:
  - app-guide
  - memories
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    Saved memories contains notes you choose to save. In Settings it opens a separate manager: confirmed note changes are immediate and Settings Cancel does not undo them. This manager and direct `/remember` need neither the Skills and memory switch nor message collection. The separate Memory section controls optional message collection; its fields use Settings Save/Cancel. Dream and heartbeat only suggest changes for review. Deleting a note also clears collected messages and suggestions in its scope (all projects for a global note), not other saved notes or earlier history.

    From the terminal, `hm --remember [global|project] <text>` saves the exact note locally (project by default). `hm --forget <id or description>` finds accessible notes: IDs and exact text are resolved locally; descriptions send batches of global and current-project notes to AI. The app shows matches in a numbered menu: press a number to select, then confirm deletion in a separate menu. 0 cancels; 9 cycles pages when needed. Deletion requires an interactive terminal, even with --yes. No match, a changed note, or a lookup failure means no deletion. The slash aliases `hm /remember ...` and `hm /forget ...` use these same flows. A chat answer cannot save or delete notes: never claim success without an application-generated result; explain these commands instead.

    Only notes the user explicitly saves become memories. In chat, `/remember [global|project] <text>` saves a note; project is the default. `/memories` lists available notes and IDs; `/forget <id>` deletes a listed note from future selection. `hm --memories` opens the local manager from the terminal; Saved memories is also in Help and Settings. It can create, edit, and delete notes without AI; deletion in the manager asks for confirmation. Each note allows 1,000 characters, with 100 notes per scope. Project scope follows the nearest Git root, otherwise the current folder. Each AI request selects at most five notes within 800 estimated tokens including formatting. Selection is local; saving a note makes no AI call. Selected notes go to OpenAI. Deleting a note does not erase earlier audit records or text already in conversation. Never ask to save secrets.
  it: |-
    Ricordi salvati contiene le note che scegli di conservare. Nelle impostazioni apre un gestore separato: le modifiche confermate alle note sono immediate e Annulla nelle impostazioni non le annulla. Il gestore e `/remember` non richiedono né l’interruttore Skills e memoria né la raccolta dei messaggi. La sezione distinta Memoria gestisce la raccolta facoltativa; i suoi campi usano Salva/Annulla delle impostazioni. Dream e heartbeat suggeriscono solo modifiche da rivedere. Eliminare una nota cancella anche messaggi raccolti e suggerimenti del suo ambito (tutti i progetti se globale), non altri ricordi salvati o la cronologia precedente.

    Dal terminale, `hm --remember [global|project] <testo>` salva la nota esatta localmente (progetto per impostazione predefinita). `hm --forget <id o descrizione>` cerca note accessibili: ID e testo esatto sono risolti localmente; le descrizioni inviano gruppi di note globali e del progetto corrente all'AI. L'app mostra le corrispondenze in un menu numerato: premi un numero per scegliere, poi conferma l'eliminazione in un menu separato. 0 annulla; 9 scorre le pagine quando necessario. L'eliminazione richiede un terminale interattivo, anche con --yes. Nessuna corrispondenza, una nota modificata o un errore di ricerca non comportano eliminazioni. Gli alias `hm /remember ...` e `hm /forget ...` usano gli stessi flussi. Una risposta in chat non può salvare o eliminare note: non dichiarare mai un successo senza un risultato generato dall'applicazione; spiega invece questi comandi.

    Diventano memorie solo le note salvate esplicitamente dall'utente. In chat, `/remember [global|project] <testo>` salva una nota; l'ambito predefinito è il progetto. `/memories` elenca note disponibili e ID; `/forget <id>` elimina una nota elencata dalle selezioni future. `hm --memories` apre il gestore locale dal terminale; Ricordi salvati è anche in Guida e Impostazioni. Permette di creare, modificare ed eliminare note senza AI; l'eliminazione nel gestore chiede conferma. Ogni nota ammette 1.000 caratteri, con 100 note per ambito. Il progetto è la radice Git più vicina, altrimenti la cartella corrente. Ogni richiesta AI seleziona al massimo cinque note entro 800 token stimati, formattazione inclusa. La selezione è locale; salvare una nota non chiama l'AI. Le note selezionate vengono inviate a OpenAI. Eliminare una nota non cancella registrazioni precedenti o testo già nella conversazione. Non chiedere mai di salvare segreti.
  fr: |-
    Souvenirs enregistrés contient les notes que vous choisissez de conserver. Dans les réglages, ce gestionnaire séparé applique immédiatement les changements confirmés aux notes ; Annuler les réglages ne les annule pas. Il fonctionne, comme `/remember`, sans activer Compétences et mémoire ni la collecte. La section distincte Mémoire gère la collecte facultative avec Enregistrer/Annuler des réglages. Dream et heartbeat proposent seulement des changements à examiner. Supprimer une note efface aussi messages collectés et suggestions de sa portée (tous les projets si globale), pas les autres souvenirs enregistrés ni l’historique précédent.

    Depuis le terminal, `hm --remember [global|project] <texte>` enregistre la note exacte localement (projet par défaut). `hm --forget <id ou description>` recherche les notes accessibles : ID et texte exact sont résolus localement ; les descriptions envoient des lots de notes globales et du projet actuel à l'IA. L'application affiche les correspondances dans un menu numéroté : appuyez sur un numéro, puis confirmez la suppression dans un menu séparé. 0 annule ; 9 parcourt les pages si nécessaire. La suppression exige un terminal interactif, même avec --yes. Aucune suppression en cas d'absence de correspondance, de note modifiée ou d'échec. Les alias `hm /remember ...` et `hm /forget ...` suivent ces mêmes parcours. Une réponse de chat ne peut pas enregistrer ni supprimer de notes : n'affirmez jamais un succès sans résultat de l'application ; expliquez ces commandes.

    Seules les notes enregistrées explicitement deviennent des mémoires. Dans le chat, `/remember [global|project] <texte>` enregistre une note ; la portée par défaut est le projet. `/memories` liste les notes disponibles et leurs identifiants ; `/forget <id>` retire une note des sélections futures. `hm --memories` ouvre le gestionnaire local depuis le terminal ; Souvenirs enregistrés est aussi dans Aide et Réglages. Il permet création, modification et suppression sans IA ; la suppression dans le gestionnaire demande confirmation. Chaque note accepte 1 000 caractères, avec 100 notes par portée. Le projet correspond à la racine Git la plus proche, sinon au dossier courant. Chaque requête IA sélectionne au plus cinq notes dans 800 jetons estimés, formatage compris. La sélection est locale ; enregistrer une note n'appelle pas l'IA. Les notes sélectionnées sont envoyées à OpenAI. Supprimer une note n'efface ni les anciennes traces ni le texte déjà dans la conversation. Ne demandez jamais d'enregistrer des secrets.
  de: |-
    Gespeicherte Erinnerungen enthält Notizen, die du selbst speicherst. In Einstellungen öffnet es eine getrennte Verwaltung: Bestätigte Notizänderungen gelten sofort und werden durch Abbrechen der Einstellungen nicht rückgängig gemacht. Sie und `/remember` brauchen weder den Schalter Skills und Gedächtnis noch Nachrichtenerfassung. Der eigene Abschnitt Gedächtnis steuert die freiwillige Erfassung mit Speichern/Abbrechen der Einstellungen. Dream und Heartbeat schlagen nur Änderungen zur Prüfung vor. Eine Notiz zu löschen entfernt auch erfasste Nachrichten und Vorschläge ihres Bereichs (alle Projekte bei globalen Notizen), nicht andere gespeicherte Notizen oder den bisherigen Verlauf.

    Im Terminal speichert `hm --remember [global|project] <Text>` die genaue Notiz lokal (Standard: Projekt). `hm --forget <ID oder Beschreibung>` sucht zugängliche Notizen: IDs und genauer Text werden lokal aufgelöst; Beschreibungen senden Gruppen globaler und aktueller Projektnotizen an die KI. Die Anwendung zeigt Treffer nummeriert: Ziffer drücken, danach die Löschung in einem getrennten Menü bestätigen. 0 bricht ab; 9 wechselt bei Bedarf die Seite. Löschen erfordert auch mit --yes ein interaktives Terminal. Kein Treffer, eine geänderte Notiz oder ein Suchfehler führen zu keiner Löschung. Auch `hm /remember ...` und `hm /forget ...` nutzen diese Abläufe. Eine Chatantwort kann keine Notizen speichern oder löschen: behaupte keinen Erfolg ohne Anwendungsergebnis; erkläre diese Befehle.

    Nur ausdrücklich gespeicherte Notizen werden zu Erinnerungen. Im Chat speichert `/remember [global|project] <Text>` eine Notiz; Standard ist das Projekt. `/memories` listet verfügbare Notizen mit IDs; `/forget <id>` entfernt eine aufgeführte Notiz aus künftiger Auswahl. `hm --memories` öffnet die lokale Verwaltung im Terminal; Gespeicherte Erinnerungen ist auch in Hilfe und Einstellungen verfügbar. Erstellen, Ändern und Löschen benötigen keine KI; Löschen in der Verwaltung verlangt Bestätigung. Pro Notiz sind 1.000 Zeichen und pro Geltungsbereich 100 Notizen möglich. Der Projektbereich folgt der nächsten Git-Wurzel, sonst dem aktuellen Ordner. Jede KI-Anfrage wählt höchstens fünf Notizen innerhalb von 800 geschätzten Token einschließlich Formatierung. Die Auswahl erfolgt lokal; Speichern ruft keine KI auf. Ausgewählte Notizen gehen an OpenAI. Löschen entfernt weder frühere Protokolle noch bereits enthaltenen Unterhaltungstext. Fordere niemals zum Speichern von Geheimnissen auf.
  es: |-
    Recuerdos guardados contiene las notas que eliges conservar. En Configuración abre un gestor separado: los cambios confirmados en notas son inmediatos y Cancelar Configuración no los deshace. Este gestor y `/remember` no requieren activar Skills y memoria ni recopilar mensajes. La sección distinta Memoria controla la recopilación opcional con Guardar/Cancelar de Configuración. Dream y heartbeat solo sugieren cambios para revisar. Borrar una nota también elimina mensajes recopilados y sugerencias de su ámbito (todos los proyectos si es global), no otros recuerdos guardados ni el historial anterior.

    Desde el terminal, `hm --remember [global|project] <texto>` guarda la nota exacta localmente (proyecto por defecto). `hm --forget <id o descripción>` busca notas accesibles: ID y texto exacto se resuelven localmente; las descripciones envían grupos de notas globales y del proyecto actual a la IA. La aplicación muestra las coincidencias en un menú numerado: pulsa un número y después confirma la eliminación en otro menú. 0 cancela; 9 recorre las páginas cuando hace falta. Eliminar requiere un terminal interactivo, incluso con --yes. Sin coincidencias, con una nota modificada o con un fallo no se elimina nada. Los alias `hm /remember ...` y `hm /forget ...` usan los mismos flujos. Una respuesta del chat no puede guardar ni eliminar notas: nunca afirmes éxito sin un resultado de la aplicación; explica estos comandos.

    Solo se convierten en memorias las notas que el usuario guarda expresamente. En chat, `/remember [global|project] <texto>` guarda una nota; el ámbito predeterminado es el proyecto. `/memories` lista notas disponibles e identificadores; `/forget <id>` elimina una nota de futuras selecciones. `hm --memories` abre el gestor local desde el terminal; Recuerdos guardados también está en Ayuda y Ajustes. Permite crear, editar y eliminar sin IA; la eliminación en el gestor pide confirmación. Cada nota admite 1.000 caracteres, con 100 notas por ámbito. El proyecto corresponde a la raíz Git más cercana o al directorio actual. Cada petición IA selecciona como máximo cinco notas dentro de 800 tokens estimados, incluido el formato. La selección es local; guardar una nota no llama a la IA. Las notas seleccionadas se envían a OpenAI. Borrar una nota no elimina registros anteriores ni texto ya presente en la conversación. Nunca pidas guardar secretos.
  vi: |-
    Ghi nhớ đã lưu chứa các ghi chú bạn chọn lưu. Trong Cài đặt, mục này mở trình quản lý riêng: thay đổi ghi chú đã xác nhận có hiệu lực ngay và Hủy Cài đặt không hoàn tác chúng. Trình quản lý và `/remember` không cần bật Kỹ năng và bộ nhớ hay thu thập tin nhắn. Mục Bộ nhớ riêng điều khiển thu thập tùy chọn bằng Lưu/Hủy của Cài đặt. Dream và heartbeat chỉ đề xuất thay đổi để xem xét. Xóa ghi chú cũng xóa tin nhắn đã thu thập và đề xuất trong phạm vi đó (mọi dự án nếu là ghi chú chung), không xóa ghi nhớ khác hay lịch sử trước đó.

    Trong terminal, `hm --remember [global|project] <nội dung>` lưu chính xác ghi chú cục bộ (mặc định là dự án). `hm --forget <ID hoặc mô tả>` tìm ghi chú có thể truy cập: ID và nội dung chính xác được xử lý cục bộ; mô tả gửi từng nhóm ghi chú chung và dự án hiện tại tới AI. Ứng dụng hiển thị kết quả bằng menu đánh số: nhấn số để chọn rồi xác nhận xóa trong menu riêng. 0 hủy; 9 chuyển trang khi cần. Xóa cần terminal tương tác, kể cả với --yes. Không xóa khi không có kết quả, ghi chú đã thay đổi hoặc tìm kiếm lỗi. Bí danh `hm /remember ...` và `hm /forget ...` dùng cùng quy trình. Câu trả lời trò chuyện không thể lưu hoặc xóa ghi chú: không khẳng định thành công nếu chưa có kết quả từ ứng dụng; hãy giải thích các lệnh này.

    Chỉ ghi chú người dùng chủ động lưu mới trở thành bộ nhớ. Trong chat, `/remember [global|project] <nội dung>` lưu ghi chú; mặc định là dự án. `/memories` liệt kê ghi chú và ID; `/forget <id>` xóa ghi chú khỏi các lần chọn sau. `hm --memories` mở trình quản lý cục bộ từ terminal; mục Bộ nhớ cũng có trong Trợ giúp và Cài đặt. Có thể tạo, sửa, xóa mà không gọi AI; xóa trong trình quản lý cần xác nhận. Mỗi ghi chú tối đa 1.000 ký tự, mỗi phạm vi tối đa 100 ghi chú. Phạm vi dự án theo thư mục gốc Git gần nhất, nếu không có thì theo thư mục hiện tại. Mỗi yêu cầu AI chọn tối đa năm ghi chú trong 800 token ước tính, gồm định dạng. Việc chọn diễn ra cục bộ; lưu ghi chú không gọi AI. Ghi chú được chọn sẽ gửi đến OpenAI. Xóa không xóa bản ghi cũ hay nội dung đã có trong hội thoại. Không bao giờ yêu cầu lưu bí mật.
