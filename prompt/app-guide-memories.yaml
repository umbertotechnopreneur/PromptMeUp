id: app-guide-memories
version: 5
description: Explicit saved notes, local management, selection limits, and deletion.
tags:
  - app-guide
  - memories
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    Saved memories is one list shared across conversations using the same local data folder. Notes do not belong to a project or working folder. In Settings, Saved memories opens a separate editor: its confirmed changes apply immediately, and Settings Cancel does not undo them. This editor and direct saving need neither the Skills and memory switch nor message collection. Dream and heartbeat only suggest changes for approval.

    `hm --remember <text>` or `/remember <text>` saves the exact note locally, without AI. `/memories` lists notes and IDs; `hm --memories` opens the editor to add, edit, or delete notes. `hm --forget <id or description>` finds notes: IDs and exact text are resolved locally; descriptions send batches of saved notes to OpenAI. Choose a numbered match, then confirm deletion. 0 cancels; 9 cycles pages when needed. This terminal deletion needs interaction even with --yes. No match, a changed note, or a lookup error means no deletion. The terminal aliases `hm /remember ...` and `hm /forget ...` use the same flows. In chat, `/forget <id>` removes the listed note. A chat answer itself cannot save or delete anything; never claim success without an application result.

    Each note allows 1,000 characters. New notes can be added while fewer than 100 are saved. Upgrades preserve every older note, including any above the limit; they remain readable, editable, and deletable. Each AI request selects at most five relevant notes within 800 estimated tokens including formatting. Selection is local; selected notes go to OpenAI. Deleting, merging, or archiving a note also clears all collected messages and suggestions, not other saved notes, previous conversation, audit history, backups, or OpenAI records. Never save secrets.
  it: |-
    Ricordi salvati è un unico elenco condiviso tra le conversazioni che usano la stessa cartella dati locale. I ricordi non appartengono a un progetto o alla cartella di lavoro. Nelle impostazioni, Ricordi salvati apre un gestore separato: le modifiche confermate sono immediate e Annulla nelle impostazioni non le annulla. Il gestore e il salvataggio diretto non richiedono Skills e memoria né raccolta dei messaggi. Dream e heartbeat propongono solo modifiche da approvare.

    `hm --remember <testo>` o `/remember <testo>` salva la nota esatta localmente, senza AI. `/memories` elenca ricordi e ID; `hm --memories` apre il gestore per aggiungerli, modificarli o eliminarli. `hm --forget <id o descrizione>` cerca ricordi: ID e testo esatto sono risolti localmente; le descrizioni inviano gruppi di ricordi a OpenAI. Scegli una corrispondenza numerata e conferma l’eliminazione. 0 annulla; 9 cambia pagina quando serve. Questa eliminazione da terminale richiede interazione anche con --yes. Nessuna corrispondenza, una nota cambiata o un errore non causano eliminazioni. Gli alias terminale `hm /remember ...` e `hm /forget ...` usano gli stessi passaggi. In chat, `/forget <id>` elimina il ricordo indicato. Una risposta in chat da sola non salva né elimina nulla: non dichiarare successo senza un risultato dell’app.

    Ogni nota ammette 1.000 caratteri. Puoi aggiungerne finché i ricordi salvati sono meno di 100. L’aggiornamento conserva tutte le note precedenti, anche oltre il limite: restano leggibili, modificabili ed eliminabili. Ogni richiesta AI sceglie al massimo cinque note pertinenti entro 800 token stimati, formattazione inclusa. La selezione è locale; le note scelte vanno a OpenAI. Eliminare, unire o archiviare una nota cancella anche tutti i messaggi raccolti e i suggerimenti, non altri ricordi, conversazioni precedenti, registri, backup o dati già presso OpenAI. Mai salvare segreti.
  fr: |-
    Souvenirs enregistrés est une liste unique partagée entre les conversations utilisant le même dossier de données local. Les notes ne dépendent ni d’un projet ni du dossier de travail. Dans les réglages, ce gestionnaire séparé applique immédiatement les changements confirmés ; Annuler les réglages ne les annule pas. Il fonctionne, comme l’enregistrement direct, sans Compétences et mémoire ni collecte de messages. Dream et heartbeat proposent seulement des changements à approuver.

    `hm --remember <texte>` ou `/remember <texte>` enregistre la note exacte localement, sans IA. `/memories` liste notes et ID ; `hm --memories` ouvre le gestionnaire pour ajouter, modifier ou supprimer. `hm --forget <id ou description>` cherche des notes : ID et texte exact sont résolus localement ; les descriptions envoient des lots de notes à OpenAI. Choisissez un résultat numéroté puis confirmez la suppression. 0 annule ; 9 change de page si nécessaire. Cette suppression dans le terminal exige une interaction même avec --yes. Aucun résultat, une note modifiée ou une erreur n’entraînent de suppression. Les alias `hm /remember ...` et `hm /forget ...` suivent les mêmes étapes. Dans le chat, `/forget <id>` retire la note indiquée. Une réponse de chat seule ne peut rien enregistrer ni supprimer : n’affirmez aucun succès sans résultat de l’application.

    Chaque note accepte 1 000 caractères. On peut en ajouter tant que le total est inférieur à 100. La mise à jour conserve toutes les anciennes notes, même au-delà du plafond ; elles restent consultables, modifiables et supprimables. Chaque requête IA choisit au plus cinq notes pertinentes dans 800 jetons estimés, formatage compris. La sélection est locale ; les notes choisies vont à OpenAI. Supprimer, fusionner ou archiver une note efface aussi tous les messages collectés et les suggestions, pas les autres notes, conversations précédentes, journaux, sauvegardes ou données déjà chez OpenAI. Ne jamais enregistrer de secrets.
  de: |-
    Gespeicherte Erinnerungen sind eine gemeinsame Liste für alle Gespräche mit demselben lokalen Datenordner. Notizen gehören weder zu einem Projekt noch zum Arbeitsordner. In Einstellungen öffnet sich eine separate Verwaltung: Bestätigte Änderungen gelten sofort; Abbrechen der Einstellungen macht sie nicht rückgängig. Verwaltung und direktes Speichern brauchen weder Skills und Gedächtnis noch Nachrichtenerfassung. Dream und Heartbeat schlagen nur Änderungen zur Freigabe vor.

    `hm --remember <Text>` oder `/remember <Text>` speichert die genaue Notiz lokal, ohne KI. `/memories` listet Notizen und IDs; `hm --memories` öffnet die Verwaltung zum Hinzufügen, Ändern oder Löschen. `hm --forget <ID oder Beschreibung>` sucht Notizen: IDs und genauer Text werden lokal aufgelöst; Beschreibungen senden Notizgruppen an OpenAI. Einen nummerierten Treffer wählen, dann die Löschung bestätigen. 0 bricht ab; 9 wechselt bei Bedarf Seiten. Dieses Löschen im Terminal bleibt auch mit --yes interaktiv. Kein Treffer, eine geänderte Notiz oder ein Suchfehler führen zu keiner Löschung. Die Terminal-Aliase `hm /remember ...` und `hm /forget ...` nutzen dieselben Abläufe. Im Chat entfernt `/forget <id>` die genannte Notiz. Eine Chatantwort selbst speichert oder löscht nichts; behaupte keinen Erfolg ohne Anwendungsergebnis.

    Eine Notiz erlaubt 1.000 Zeichen. Neue Notizen sind möglich, solange weniger als 100 gespeichert sind. Das Update bewahrt sämtliche älteren Notizen, auch über dem Limit; sie bleiben lesbar, bearbeitbar und löschbar. Jede KI-Anfrage wählt höchstens fünf passende Notizen innerhalb von 800 geschätzten Token einschließlich Formatierung. Die Auswahl erfolgt lokal; ausgewählte Notizen gehen an OpenAI. Löschen, Zusammenführen oder Archivieren einer Notiz entfernt auch alle erfassten Nachrichten und Vorschläge, nicht andere Notizen, bisherige Gespräche, Protokolle, Sicherungen oder bereits bei OpenAI gespeicherte Daten. Niemals Geheimnisse speichern.
  es: |-
    Recuerdos guardados es una lista compartida entre las conversaciones que usan la misma carpeta local de datos. Las notas no pertenecen a un proyecto ni a la carpeta de trabajo. En Configuración abre un gestor separado: sus cambios confirmados son inmediatos y Cancelar Configuración no los deshace. El gestor y el guardado directo no necesitan Skills y memoria ni recopilación de mensajes. Dream y heartbeat solo sugieren cambios para aprobar.

    `hm --remember <texto>` o `/remember <texto>` guarda la nota exacta localmente, sin IA. `/memories` lista notas e ID; `hm --memories` abre el gestor para añadir, editar o borrar. `hm --forget <id o descripción>` busca notas: ID y texto exacto se resuelven localmente; las descripciones envían grupos de notas a OpenAI. Elige un resultado numerado y confirma el borrado. 0 cancela; 9 cambia de página cuando hace falta. Este borrado en terminal exige interacción incluso con --yes. Sin resultados, con una nota modificada o con un error no se elimina nada. Los alias `hm /remember ...` y `hm /forget ...` usan los mismos pasos. En chat, `/forget <id>` elimina la nota indicada. Una respuesta del chat no guarda ni borra nada por sí sola: nunca afirmes éxito sin un resultado de la aplicación.

    Cada nota admite 1.000 caracteres. Puedes añadir notas mientras haya menos de 100. La actualización conserva todas las anteriores, incluso por encima del límite; siguen disponibles para leer, editar y borrar. Cada petición IA elige como máximo cinco notas pertinentes dentro de 800 tokens estimados, incluido el formato. La selección es local; las notas elegidas van a OpenAI. Borrar, fusionar o archivar una nota también elimina todos los mensajes recopilados y las sugerencias, no otras notas, conversaciones anteriores, registros, copias de seguridad ni datos ya en OpenAI. Nunca guardes secretos.
  vi: |-
    Ghi nhớ đã lưu là một danh sách dùng chung giữa các cuộc trò chuyện có cùng thư mục dữ liệu cục bộ. Ghi chú không thuộc riêng dự án hay thư mục làm việc. Trong Cài đặt, mục này mở trình quản lý riêng: thay đổi đã xác nhận có hiệu lực ngay, Hủy Cài đặt không hoàn tác chúng. Trình quản lý và lưu trực tiếp không cần bật Kỹ năng và bộ nhớ hay thu thập tin nhắn. Dream và heartbeat chỉ đề xuất thay đổi để bạn duyệt.

    `hm --remember <nội dung>` hoặc `/remember <nội dung>` lưu đúng ghi chú cục bộ, không gọi AI. `/memories` liệt kê ghi chú và ID; `hm --memories` mở trình quản lý để thêm, sửa hoặc xóa. `hm --forget <ID hoặc mô tả>` tìm ghi chú: ID và nội dung chính xác được xử lý cục bộ; mô tả gửi các nhóm ghi chú tới OpenAI. Chọn kết quả theo số rồi xác nhận xóa. 0 hủy; 9 chuyển trang khi cần. Việc xóa trong terminal vẫn cần tương tác dù có --yes. Không xóa nếu không có kết quả, ghi chú đã đổi hoặc tìm kiếm lỗi. Bí danh terminal `hm /remember ...` và `hm /forget ...` dùng cùng quy trình. Trong chat, `/forget <id>` xóa ghi chú chỉ định. Câu trả lời chat tự nó không thể lưu hay xóa; đừng khẳng định thành công khi chưa có kết quả từ ứng dụng.

    Mỗi ghi chú tối đa 1.000 ký tự. Có thể thêm khi tổng số dưới 100. Bản cập nhật giữ mọi ghi chú cũ, kể cả vượt giới hạn; vẫn có thể đọc, sửa và xóa chúng. Mỗi yêu cầu AI chọn tối đa năm ghi chú liên quan trong 800 token ước tính, gồm định dạng. Việc chọn diễn ra cục bộ; ghi chú được chọn gửi tới OpenAI. Xóa, gộp hoặc lưu trữ ghi chú cũng xóa mọi tin nhắn đã thu thập và đề xuất, không xóa ghi chú khác, hội thoại trước, nhật ký, bản sao lưu hay dữ liệu đã ở OpenAI. Không lưu bí mật.
