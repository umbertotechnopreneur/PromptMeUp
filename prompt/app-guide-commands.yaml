id: app-guide-commands
version: 2
description: Command suggestions, local review, authorization, and execution limits.
tags:
  - app-guide
  - commands
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    Direct mode is on by default for questions and chat, and can be disabled under AI in `hm --setup`. `hm --direct "request"` forces it for one session. Direct mode requires successful local and AI risk checks; high, critical or unknown risk and failed AI review block execution. Eligible commands show their full preview and a five-second progress countdown: Enter runs now, Esc cancels the chain, Ctrl+C cancels the app. The normal mode asks for confirmation instead. Output is analyzed in the same conversation; every next command repeats the gate, with at most eight executions per chain. Multiple alternatives still require choosing one. Only the application can enforce this flow; AI text cannot grant permission.

    The AI proposes commands; it does not execute them or authorize execution. Every command goes through local deterministic risk checks, AI review as required by the selected mode, an exact local preview, and the local authorization gate in a live terminal. `/run <command>` starts that flow in chat; `--yes` cannot approve chat commands. Approved commands run as the current user through `pwsh -NoProfile -NonInteractive`, with timeout and bounded output. They can change real files and are not isolated in a sandbox. Interactive interfaces such as Settings, Help, and the memory manager must be opened manually from the terminal, never through the chat command runner. Commands settings control timeout (default 30 seconds, range 5–300) and captured output (default 12,000 characters, range 1,000–32,768). These are defaults, not observed settings. Never put API keys, passwords, or other secrets in command arguments. Output sent for AI follow-up is redacted for recognizable credentials.
  it: |-
    La modalità direct è attiva di default per domande e chat; puoi disattivarla in AI dentro `hm --setup`. `hm --direct "richiesta"` la forza per una sessione. Richiede controlli locali e AI riusciti: rischi alti, critici o sconosciuti e revisione AI fallita bloccano l'esecuzione. Ogni comando ammesso mostra l'anteprima completa e un countdown di cinque secondi con barra: Invio esegue subito, Esc annulla la sequenza, Ctrl+C chiude l'app. La modalità normale chiede invece conferma. L'output viene analizzato nella stessa conversazione; ogni comando successivo ripete il controllo, fino a otto esecuzioni per sequenza. Più alternative richiedono una scelta. Solo l'app applica questo flusso; il testo AI non concede permessi.

    L'AI propone comandi; non li esegue e non ne autorizza l'esecuzione. Ogni comando passa da controlli locali deterministici del rischio, revisione AI richiesta dalla modalità scelta, anteprima locale esatta e autorizzazione locale in un terminale interattivo. `/run <comando>` avvia questo flusso in chat; `--yes` non può approvare comandi della chat. I comandi approvati usano l'utente corrente tramite `pwsh -NoProfile -NonInteractive`, con durata e output limitati. Possono cambiare file reali e non sono isolati in un ambiente protetto. Interfacce interattive come Impostazioni, Guida e gestore memorie vanno aperte manualmente dal terminale, mai tramite l'esecutore della chat. Le impostazioni Comandi controllano durata (predefinita 30 secondi, intervallo 5–300) e output acquisito (predefinito 12.000 caratteri, intervallo 1.000–32.768). Sono valori predefiniti, non impostazioni osservate. Non inserire chiavi API, password o segreti negli argomenti dei comandi. L'output inviato all'AI per approfondimenti viene filtrato per oscurare le credenziali riconoscibili.
  fr: |-
    Le mode direct est actif par défaut pour les questions et le chat ; désactivez-le dans AI avec `hm --setup`. `hm --direct "demande"` le force pour une session. Les contrôles locaux et IA sont requis ; un risque élevé, critique ou inconnu et un échec de l'analyse IA bloquent l'exécution. Chaque commande admise affiche son aperçu complet et un délai de cinq secondes avec une barre : Entrée lance immédiatement, Échap annule la séquence, Ctrl+C ferme l'app. Le mode normal demande confirmation. Le résultat est analysé dans la même conversation ; chaque commande suivante repasse les contrôles, avec huit exécutions maximum par séquence. Plusieurs alternatives exigent un choix. Seule l'app applique ce processus ; le texte IA ne donne aucune autorisation.

    L'IA propose des commandes ; elle ne les exécute pas et ne les autorise pas. Chaque commande passe par des contrôles locaux déterministes du risque, une analyse IA selon le mode choisi, un aperçu local exact et une autorisation locale dans un terminal interactif. `/run <commande>` lance ce processus dans le chat ; `--yes` ne peut pas approuver les commandes du chat. Les commandes approuvées utilisent le compte courant via `pwsh -NoProfile -NonInteractive`, avec délai et sortie limités. Elles peuvent modifier de vrais fichiers et ne sont pas isolées. Les interfaces interactives comme Réglages, Aide et le gestionnaire de mémoires doivent être ouvertes manuellement depuis le terminal, jamais via l'exécuteur du chat. Les réglages Commandes contrôlent le délai (30 secondes par défaut, 5–300) et la sortie capturée (12 000 caractères par défaut, 1 000–32 768). Ce sont des valeurs par défaut, pas des réglages observés. Ne mettez jamais de clés API, mots de passe ou secrets dans les arguments. Les identifiants reconnaissables sont masqués dans la sortie envoyée à l'IA pour un suivi.
  de: |-
    Der Direktmodus ist für Fragen und Chat standardmäßig aktiv; unter AI in `hm --setup` ausschalten. `hm --direct "Anfrage"` aktiviert ihn für eine Sitzung. Lokale und erfolgreiche KI-Prüfungen sind erforderlich; hohes, kritisches oder unbekanntes Risiko sowie fehlgeschlagene KI-Prüfung blockieren die Ausführung. Jeder zulässige Befehl zeigt die vollständige Vorschau und einen Fünf-Sekunden-Countdown mit Balken: Eingabe startet sofort, Esc bricht die Folge ab, Strg+C beendet die App. Der normale Modus fragt nach Bestätigung. Die Ausgabe wird im selben Gespräch analysiert; jeder weitere Befehl durchläuft dieselbe Prüfung, höchstens acht Ausführungen je Folge. Mehrere Alternativen erfordern eine Auswahl. Nur die App steuert diesen Ablauf; KI-Text erteilt keine Freigabe.

    Die KI schlägt Befehle vor; sie führt sie weder aus noch genehmigt sie sie. Jeder Befehl durchläuft deterministische lokale Risikoprüfungen, eine KI-Prüfung gemäß gewähltem Modus, eine genaue lokale Vorschau und die lokale Freigabe im interaktiven Terminal. `/run <Befehl>` startet diesen Ablauf im Chat; `--yes` genehmigt keine Chatbefehle. Genehmigte Befehle laufen als aktueller Benutzer über `pwsh -NoProfile -NonInteractive`, mit Zeit- und Ausgabelimit. Sie können echte Dateien ändern und laufen nicht isoliert. Interaktive Oberflächen wie Einstellungen, Hilfe und Erinnerungsverwaltung müssen manuell im Terminal geöffnet werden, niemals über den Chat-Ausführer. Der Bereich Befehle steuert Laufzeit (Standard 30 Sekunden, 5–300) und erfasste Ausgabe (Standard 12.000 Zeichen, 1.000–32.768). Das sind Standardwerte, keine beobachteten Einstellungen. Keine API-Schlüssel, Passwörter oder anderen Geheimnisse in Befehlsargumente setzen. Erkennbare Zugangsdaten werden vor KI-Nachfragen aus der Ausgabe maskiert.
  es: |-
    El modo directo está activo por defecto para preguntas y chat; desactívalo en AI con `hm --setup`. `hm --direct "solicitud"` lo fuerza para una sesión. Requiere controles locales y de IA válidos; el riesgo alto, crítico o desconocido y los fallos de revisión bloquean la ejecución. Cada comando permitido muestra su vista previa completa y una barra de cuenta atrás de cinco segundos: Intro ejecuta ahora, Esc cancela la secuencia, Ctrl+C cierra la app. El modo normal pide confirmación. El resultado se analiza en la misma conversación; cada siguiente comando repite los controles, hasta ocho ejecuciones por secuencia. Varias alternativas requieren elegir una. Solo la app aplica este flujo; el texto de la IA no otorga permisos.

    La IA propone comandos; no los ejecuta ni autoriza su ejecución. Cada comando pasa por controles locales deterministas de riesgo, revisión IA según el modo elegido, vista previa local exacta y autorización local en un terminal interactivo. `/run <comando>` inicia este proceso en chat; `--yes` no aprueba comandos del chat. Los comandos aprobados usan la cuenta actual mediante `pwsh -NoProfile -NonInteractive`, con tiempo y salida limitados. Pueden modificar archivos reales y no están aislados. Las interfaces interactivas como Ajustes, Ayuda y el gestor de memorias deben abrirse manualmente desde el terminal, nunca mediante el ejecutor del chat. Los ajustes Comandos controlan el tiempo (30 segundos por defecto, 5–300) y la salida capturada (12.000 caracteres por defecto, 1.000–32.768). Son valores predeterminados, no ajustes observados. Nunca incluyas claves API, contraseñas ni secretos en argumentos. Las credenciales reconocibles se ocultan en la salida enviada a la IA para continuar.
  vi: |-
    Chế độ direct mặc định bật cho câu hỏi và chat; tắt trong AI tại `hm --setup`. `hm --direct "yêu cầu"` bật cho một phiên. Cần kiểm tra cục bộ và AI thành công; rủi ro cao, nghiêm trọng, chưa rõ hoặc lỗi đánh giá AI sẽ chặn chạy. Mỗi lệnh hợp lệ hiện bản xem trước đầy đủ và thanh đếm ngược năm giây: Enter chạy ngay, Esc hủy chuỗi, Ctrl+C đóng ứng dụng. Chế độ thường yêu cầu xác nhận. Đầu ra được phân tích trong cùng hội thoại; mỗi lệnh sau phải qua kiểm tra lại, tối đa tám lệnh mỗi chuỗi. Nếu có nhiều lựa chọn, phải chọn một. Chỉ ứng dụng thực hiện quy trình; văn bản AI không cấp quyền.

    AI đề xuất lệnh; không chạy hay cấp quyền chạy. Mỗi lệnh đi qua đánh giá rủi ro xác định cục bộ, đánh giá AI theo chế độ đã chọn, bản xem trước chính xác và cơ chế cấp quyền cục bộ trong terminal tương tác. `/run <lệnh>` bắt đầu quy trình này trong chat; `--yes` không duyệt lệnh chat. Lệnh được duyệt chạy bằng tài khoản hiện tại qua `pwsh -NoProfile -NonInteractive`, có giới hạn thời gian và đầu ra. Lệnh có thể thay đổi tệp thật và không được cô lập. Các giao diện tương tác như Cài đặt, Trợ giúp và quản lý bộ nhớ phải mở thủ công trong terminal, không qua trình chạy lệnh chat. Mục Lệnh điều khiển thời gian (mặc định 30 giây, 5–300) và đầu ra (mặc định 12.000 ký tự, 1.000–32.768). Đây là mặc định, không phải cài đặt đã đọc. Không đưa khóa API, mật khẩu hay bí mật vào tham số lệnh. Thông tin xác thực có thể nhận diện được che trước khi gửi đầu ra cho AI hỏi tiếp.
