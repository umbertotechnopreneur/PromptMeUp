id: app-guide-commands
version: 1
description: Command suggestions, local review, authorization, and execution limits.
tags:
  - app-guide
  - commands
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    The AI proposes commands; it does not execute them or authorize execution. Every command goes through local deterministic risk checks, an optional advisory AI review, an exact local preview, and explicit user approval in a live terminal. `/run <command>` starts that flow in chat; `--yes` cannot approve chat commands. Approved commands run as the current user through `pwsh -NoProfile -NonInteractive`, with timeout and bounded output. They can change real files and are not isolated in a sandbox. Interactive interfaces such as Settings, Help, and the memory manager must be opened manually from the terminal, never through the chat command runner. Commands settings control timeout (default 30 seconds, range 5–300) and captured output (default 12,000 characters, range 1,000–32,768). These are defaults, not observed settings. Never put API keys, passwords, or other secrets in command arguments. Output sent for AI follow-up is redacted for recognizable credentials.
  it: |-
    L'AI propone comandi; non li esegue e non ne autorizza l'esecuzione. Ogni comando passa da controlli locali deterministici del rischio, revisione AI consultiva facoltativa, anteprima locale esatta e approvazione esplicita dell'utente in un terminale interattivo. `/run <comando>` avvia questo flusso in chat; `--yes` non può approvare comandi della chat. I comandi approvati usano l'utente corrente tramite `pwsh -NoProfile -NonInteractive`, con durata e output limitati. Possono cambiare file reali e non sono isolati in un ambiente protetto. Interfacce interattive come Impostazioni, Guida e gestore memorie vanno aperte manualmente dal terminale, mai tramite l'esecutore della chat. Le impostazioni Comandi controllano durata (predefinita 30 secondi, intervallo 5–300) e output acquisito (predefinito 12.000 caratteri, intervallo 1.000–32.768). Sono valori predefiniti, non impostazioni osservate. Non inserire chiavi API, password o segreti negli argomenti dei comandi. L'output inviato all'AI per approfondimenti viene filtrato per oscurare le credenziali riconoscibili.
  fr: |-
    L'IA propose des commandes ; elle ne les exécute pas et ne les autorise pas. Chaque commande passe par des contrôles locaux déterministes du risque, un avis IA facultatif, un aperçu local exact et une approbation explicite dans un terminal interactif. `/run <commande>` lance ce processus dans le chat ; `--yes` ne peut pas approuver les commandes du chat. Les commandes approuvées utilisent le compte courant via `pwsh -NoProfile -NonInteractive`, avec délai et sortie limités. Elles peuvent modifier de vrais fichiers et ne sont pas isolées. Les interfaces interactives comme Réglages, Aide et le gestionnaire de mémoires doivent être ouvertes manuellement depuis le terminal, jamais via l'exécuteur du chat. Les réglages Commandes contrôlent le délai (30 secondes par défaut, 5–300) et la sortie capturée (12 000 caractères par défaut, 1 000–32 768). Ce sont des valeurs par défaut, pas des réglages observés. Ne mettez jamais de clés API, mots de passe ou secrets dans les arguments. Les identifiants reconnaissables sont masqués dans la sortie envoyée à l'IA pour un suivi.
  de: |-
    Die KI schlägt Befehle vor; sie führt sie weder aus noch genehmigt sie sie. Jeder Befehl durchläuft deterministische lokale Risikoprüfungen, eine optionale beratende KI-Prüfung, eine genaue lokale Vorschau und ausdrückliche Benutzerfreigabe im interaktiven Terminal. `/run <Befehl>` startet diesen Ablauf im Chat; `--yes` genehmigt keine Chatbefehle. Genehmigte Befehle laufen als aktueller Benutzer über `pwsh -NoProfile -NonInteractive`, mit Zeit- und Ausgabelimit. Sie können echte Dateien ändern und laufen nicht isoliert. Interaktive Oberflächen wie Einstellungen, Hilfe und Erinnerungsverwaltung müssen manuell im Terminal geöffnet werden, niemals über den Chat-Ausführer. Der Bereich Befehle steuert Laufzeit (Standard 30 Sekunden, 5–300) und erfasste Ausgabe (Standard 12.000 Zeichen, 1.000–32.768). Das sind Standardwerte, keine beobachteten Einstellungen. Keine API-Schlüssel, Passwörter oder anderen Geheimnisse in Befehlsargumente setzen. Erkennbare Zugangsdaten werden vor KI-Nachfragen aus der Ausgabe maskiert.
  es: |-
    La IA propone comandos; no los ejecuta ni autoriza su ejecución. Cada comando pasa por controles locales deterministas de riesgo, revisión IA orientativa opcional, vista previa local exacta y aprobación expresa en un terminal interactivo. `/run <comando>` inicia este proceso en chat; `--yes` no aprueba comandos del chat. Los comandos aprobados usan la cuenta actual mediante `pwsh -NoProfile -NonInteractive`, con tiempo y salida limitados. Pueden modificar archivos reales y no están aislados. Las interfaces interactivas como Ajustes, Ayuda y el gestor de memorias deben abrirse manualmente desde el terminal, nunca mediante el ejecutor del chat. Los ajustes Comandos controlan el tiempo (30 segundos por defecto, 5–300) y la salida capturada (12.000 caracteres por defecto, 1.000–32.768). Son valores predeterminados, no ajustes observados. Nunca incluyas claves API, contraseñas ni secretos en argumentos. Las credenciales reconocibles se ocultan en la salida enviada a la IA para continuar.
  vi: |-
    AI đề xuất lệnh; không chạy hay cấp quyền chạy. Mỗi lệnh đi qua đánh giá rủi ro xác định cục bộ, đánh giá AI tùy chọn để tham khảo, bản xem trước chính xác và sự chấp thuận rõ ràng trong terminal tương tác. `/run <lệnh>` bắt đầu quy trình này trong chat; `--yes` không duyệt lệnh chat. Lệnh được duyệt chạy bằng tài khoản hiện tại qua `pwsh -NoProfile -NonInteractive`, có giới hạn thời gian và đầu ra. Lệnh có thể thay đổi tệp thật và không được cô lập. Các giao diện tương tác như Cài đặt, Trợ giúp và quản lý bộ nhớ phải mở thủ công trong terminal, không qua trình chạy lệnh chat. Mục Lệnh điều khiển thời gian (mặc định 30 giây, 5–300) và đầu ra (mặc định 12.000 ký tự, 1.000–32.768). Đây là mặc định, không phải cài đặt đã đọc. Không đưa khóa API, mật khẩu hay bí mật vào tham số lệnh. Thông tin xác thực có thể nhận diện được che trước khi gửi đầu ra cho AI hỏi tiếp.
