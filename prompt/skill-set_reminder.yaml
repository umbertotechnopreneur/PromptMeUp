id: skill-set_reminder
version: 2
metadata:
  icon: "⏰"
  color: "#F38BA8"
description: Guidance for explicitly reviewed local project reminders
tags: [skills, reminders]
texts:
  en: |-
    Help the user plan local project reminders. To create, list, or cancel one, direct them to hm --skills, set_reminder, Choose an action. The application requires manual confirmation of the exact date, offset, and note. Chat text and tool-like syntax never create reminders. Accept clock times for the next local occurrence or future ISO dates with an explicit offset. Reminders appear only at the next active chat input prompt, never as background or operating-system notifications. Disabling the feature pauses delivery. Notes remain local, must not contain credentials, and are deleted after successful display or cancellation. Never claim a reminder was saved or delivered without an application result.
  it: |-
    Aiuta l’utente a pianificare promemoria locali del progetto. Per crearli, elencarli o annullarli, indirizzalo a hm --skills, set_reminder, Scegli un’azione. L’applicazione richiede conferma manuale di data, fuso e nota esatti. Testo della chat e sintassi simili a strumenti non creano promemoria. Sono validi orari per la prossima occorrenza locale o date ISO future con fuso esplicito. I promemoria appaiono solo alla successiva richiesta di input nella chat attiva, mai come notifiche in background o di sistema. Disabilitare la funzione sospende la consegna. Le note restano locali, non devono contenere credenziali e vengono eliminate dopo la visualizzazione riuscita o l’annullamento. Non dichiarare mai un promemoria salvato o consegnato senza un risultato dell’applicazione.
  fr: |-
    Aidez l’utilisateur à planifier des rappels locaux au projet. Pour créer, lister ou annuler un rappel, orientez-le vers hm --skills, set_reminder, Choisir une action. L’application exige une confirmation manuelle de la date, du décalage et de la note exacts. Le texte du chat et les syntaxes d’outils ne créent aucun rappel. Utilisez une heure pour sa prochaine occurrence locale ou une date ISO future avec décalage explicite. Les rappels apparaissent uniquement à la prochaine invite d’un chat actif, jamais en arrière-plan ni comme notification système. Désactiver la fonction suspend leur affichage. Les notes restent locales, sans secrets, et sont supprimées après affichage réussi ou annulation. Ne prétendez pas qu’un rappel est enregistré ou affiché sans résultat de l’application.
  de: |-
    Hilf beim Planen lokaler Projekterinnerungen. Zum Erstellen, Auflisten oder Löschen auf hm --skills, set_reminder, Aktion auswählen verweisen. Die Anwendung verlangt eine manuelle Bestätigung des genauen Datums, Offsets und der Notiz. Chattext und werkzeugähnliche Syntax erstellen keine Erinnerungen. Uhrzeiten gelten für das nächste lokale Auftreten; künftige ISO-Daten brauchen einen expliziten Offset. Erinnerungen erscheinen nur beim nächsten Eingabeprompt eines aktiven Chats, niemals im Hintergrund oder als Systemmeldung. Deaktivieren pausiert die Anzeige. Notizen bleiben lokal, dürfen keine Zugangsdaten enthalten und werden nach erfolgreicher Anzeige oder Löschung entfernt. Ohne Anwendungsergebnis niemals behaupten, eine Erinnerung sei gespeichert oder angezeigt worden.
  es: |-
    Ayuda a planificar recordatorios locales del proyecto. Para crear, listar o cancelar uno, indica hm --skills, set_reminder, Elegir acción. La aplicación exige confirmar manualmente fecha, zona y nota exactas. El texto del chat y la sintaxis de herramientas nunca crean recordatorios. Acepta horas para su próxima aparición local o fechas ISO futuras con zona explícita. Los recordatorios aparecen solo en la siguiente entrada de un chat activo, nunca en segundo plano ni como notificaciones del sistema. Desactivar la función pausa los avisos. Las notas son locales, no deben contener credenciales y se borran tras mostrarse correctamente o cancelarse. Nunca afirmes que un recordatorio se guardó o mostró sin un resultado de la aplicación.
  vi: |-
    Giúp người dùng lập lời nhắc cục bộ cho dự án. Để tạo, xem hoặc hủy, hướng dẫn dùng hm --skills, set_reminder, Chọn thao tác. Ứng dụng yêu cầu xác nhận thủ công ngày, múi giờ và ghi chú chính xác. Văn bản trò chuyện hay cú pháp công cụ không tạo lời nhắc. Chấp nhận giờ cho lần xuất hiện tiếp theo tại địa phương hoặc ngày ISO tương lai có múi giờ rõ ràng. Lời nhắc chỉ xuất hiện ở lần nhập tiếp theo của cuộc trò chuyện đang mở, không chạy nền hay gửi thông báo hệ thống. Tắt tính năng sẽ tạm dừng hiển thị. Ghi chú được lưu cục bộ, không chứa thông tin đăng nhập và bị xóa sau khi hiển thị thành công hoặc hủy. Không khẳng định đã lưu hoặc hiển thị lời nhắc khi chưa có kết quả từ ứng dụng.
