id: app-guide-costs
version: 1
description: Provider usage, local estimates, guide overhead, and caching.
tags:
  - app-guide
  - costs
metadata:
  owner: PromptMeUp
  role: system
  source: packaged-local-guide
texts:
  en: |-
    `/costs` opens the cost dashboard inside chat. From the terminal, `hm --costs` also refreshes prices. Costs computed from local request history are estimates; an available organization total is shown separately. Provider input/output counts measure consumption for each request, while active context estimates measure what is retained now. Resending history consumes input again; `/clear` does not undo earlier usage or charges. Loading the local guide itself needs no network call, but asking the model to select chapters and then answer can use two AI calls in one turn. Both calls contribute reported tokens and estimated costs; guide text counts as system context while retained. System instructions also occupy context. Prompt caching can reduce eligible repeated-input costs when supported; it does not remove that text from the context window or guarantee a cache hit. Do not invent current prices, account balance, or observed usage.
  it: |-
    `/costs` apre il riepilogo dei costi dentro la chat. Dal terminale, `hm --costs` aggiorna anche i prezzi. I costi calcolati dalla cronologia locale sono stime; un eventuale totale dell'organizzazione viene mostrato separatamente. I conteggi input/output del provider misurano il consumo di ogni richiesta, mentre il contesto attivo stimato misura ciò che viene conservato ora. Reinviare la cronologia consuma nuovamente input; `/clear` non annulla utilizzo o addebiti precedenti. Caricare la guida locale non richiede rete, ma chiedere al modello di scegliere i capitoli e poi rispondere può usare due chiamate AI nello stesso turno. Entrambe contribuiscono ai token dichiarati e ai costi stimati; la guida conta come contesto di sistema finché conservata. Anche le istruzioni di sistema occupano contesto. La cache dei prompt può ridurre il costo di input ripetuto idoneo quando supportata; non elimina quel testo dalla finestra di contesto e non garantisce un riuso della cache. Non inventare prezzi attuali, saldo o consumi osservati.
  fr: |-
    `/costs` ouvre le tableau des coûts dans le chat. Depuis le terminal, `hm --costs` actualise aussi les prix. Les coûts calculés depuis l'historique local sont des estimations ; un éventuel total d'organisation apparaît séparément. Les comptes d'entrée/sortie du fournisseur mesurent la consommation par requête, tandis que le contexte actif estimé mesure ce qui est conservé maintenant. Renvoyer l'historique consomme de nouveau de l'entrée ; `/clear` n'annule ni consommation ni frais passés. Charger le guide local ne nécessite pas le réseau, mais demander au modèle de choisir les chapitres puis de répondre peut utiliser deux appels IA par tour. Les deux contribuent aux jetons déclarés et aux coûts estimés ; le guide compte comme contexte système tant qu'il est conservé. Les instructions système occupent aussi du contexte. Le cache peut réduire le coût d'entrées répétées éligibles quand il est pris en charge ; il ne retire pas ce texte de la fenêtre et ne garantit pas une réutilisation. N'inventez ni prix actuels, ni solde, ni consommation observée.
  de: |-
    `/costs` öffnet die Kostenübersicht im Chat. Im Terminal aktualisiert `hm --costs` außerdem Preise. Aus lokalem Anfrageverlauf berechnete Kosten sind Schätzungen; ein verfügbarer Organisationsgesamtwert erscheint separat. Anbieterzählungen für Ein- und Ausgabe messen Verbrauch pro Anfrage; die aktive Kontextschätzung misst den momentan behaltenen Inhalt. Erneutes Senden der Historie verbraucht erneut Eingabe; `/clear` macht früheren Verbrauch und Kosten nicht rückgängig. Das Laden der lokalen Anleitung braucht kein Netz, aber die Kapitelauswahl durch das Modell mit anschließender Antwort kann zwei KI-Aufrufe pro Runde benötigen. Beide zählen zu gemeldeten Token und geschätzten Kosten; die Anleitung zählt zum Systemkontext, solange sie behalten wird. Systemanweisungen belegen ebenfalls Kontext. Prompt-Caching kann geeignete wiederholte Eingabe verbilligen, sofern unterstützt; es entfernt den Text nicht aus dem Kontextfenster und garantiert keinen Treffer. Erfinde keine aktuellen Preise, Guthaben oder beobachteten Verbrauchswerte.
  es: |-
    `/costs` abre el panel de costes dentro del chat. Desde el terminal, `hm --costs` también actualiza precios. Los costes calculados con el historial local son estimaciones; un total de organización disponible aparece por separado. Los recuentos de entrada/salida del proveedor miden consumo por petición; el contexto activo estimado mide lo conservado ahora. Reenviar historial consume entrada otra vez; `/clear` no anula uso ni cargos anteriores. Cargar la guía local no necesita red, pero pedir al modelo que elija capítulos y después responda puede usar dos llamadas IA por turno. Ambas suman tokens declarados y costes estimados; la guía cuenta como contexto del sistema mientras se conserva. Las instrucciones del sistema también ocupan contexto. La caché puede reducir costes de entrada repetida elegible cuando se admite; no quita ese texto de la ventana ni garantiza una coincidencia. No inventes precios actuales, saldo ni consumo observado.
  vi: |-
    `/costs` mở bảng chi phí trong chat. Từ terminal, `hm --costs` còn cập nhật giá. Chi phí tính từ lịch sử yêu cầu cục bộ là ước tính; tổng tổ chức nếu có được hiển thị riêng. Số token đầu vào/đầu ra của nhà cung cấp đo tiêu thụ mỗi yêu cầu; ngữ cảnh ước tính đo nội dung đang giữ. Gửi lại lịch sử tiêu thụ đầu vào lần nữa; `/clear` không hoàn tác sử dụng hay phí trước đó. Tải tài liệu cục bộ không cần mạng, nhưng nhờ mô hình chọn chương rồi trả lời có thể dùng hai lần gọi AI mỗi lượt. Cả hai cộng vào token báo cáo và chi phí ước tính; tài liệu tính là ngữ cảnh hệ thống khi còn được giữ. Hướng dẫn hệ thống cũng chiếm ngữ cảnh. Bộ nhớ đệm prompt có thể giảm chi phí đầu vào lặp đủ điều kiện khi được hỗ trợ; không loại văn bản khỏi cửa sổ và không bảo đảm trúng bộ nhớ đệm. Không bịa giá hiện tại, số dư hay mức dùng đã quan sát.
